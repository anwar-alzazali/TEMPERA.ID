<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver Dashboard - TEMPERA.ID</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-black text-white min-h-screen p-4">
<div class="max-w-md mx-auto">
<div class="bg-zinc-900 border border-zinc-800 rounded-[24px] p-6">
<div class="flex items-center gap-4 mb-6">
<div id="avatar" class="w-16 h-16 rounded-full bg-yellow-500 flex items-center justify-center text-black font-bold text-xl">T</div>
<div><h1 id="driverName" class="text-xl font-bold">Loading...</h1><p id="driverSlug" class="text-zinc-500 text-sm">@...</p></div>
</div>
<div class="bg-black border border-yellow-500/30 rounded-[20px] p-5 text-center">
<p class="text-[10px] tracking-[0.3em] text-yellow-500 mb-3">YOUR GOLD QR</p>
<div id="qrcode" class="flex justify-center bg-white p-3 rounded-xl mx-auto w-fit"></div>
<p id="qrLink" class="mt-3 text-xs text-zinc-400 break-all"></p>
</div>
<div class="grid grid-cols-3 gap-3 mt-4">
<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-center"><p id="scanTotal" class="text-2xl font-bold text-yellow-500">0</p><p class="text-[10px] text-zinc-500">TOTAL SCAN</p></div>
<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-center"><p id="scanToday" class="text-2xl font-bold">0</p><p class="text-[10px] text-zinc-500">HARI INI</p></div>
<div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-center"><p id="scanWeek" class="text-2xl font-bold">0</p><p class="text-[10px] text-zinc-500">LINK BOOKING</p></div>
</div>
</div>
</div>
<script>
const SUPABASE_URL = "https://wjmotidelqgcy yujacud.supabase.co".replace(" ","")
const SUPABASE_KEY = localStorage.getItem('tempera_anon_key_bener') || "YOUR_ANON_KEY"
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
const slug = window.location.pathname.split("/").filter(Boolean).pop() || "udin"
const qrUrl = `https://tempera.id/r/${slug}`
document.getElementById("driverSlug").innerText="@"+slug
document.getElementById("driverName").innerText=slug.replace(/-/g," ").replace(/\b\w/g,l=>l.toUpperCase())
document.getElementById("avatar").innerText=slug.charAt(0).toUpperCase()
document.getElementById("qrLink").innerText=qrUrl
new QRCode(document.getElementById("qrcode"), {text: qrUrl, width: 160, height: 160})
async function load(){try{const{count:t}=await supabase.from('scans').select('*',{count:'exact',head:true}).eq('driver_slug',slug);document.getElementById("scanTotal").innerText=t||0}catch(e){}}
load()
</script>
</body>
</html>
