<!DOCTYPE html><html><head><meta charset=UTF-8><title>Driver</title><link href=https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css rel=stylesheet></head><body><div class="container py-5"><div class="card p-4 mx-auto" style=max-width:500px><h4>Driver Dashboard</h4><div id=welcome class="alert alert-info"></div><button onclick=logout() class="btn btn-danger w-100">Logout</button></div></div><script type=module>
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm'
const URL='https://wjmotidelqgcyyujacud.supabase.co'
const KEY=localStorage.getItem('tempera_anon_key_bener')||''
const supabase=createClient(URL,KEY)
const {data:{user}}=await supabase.auth.getUser()
document.getElementById('welcome').innerText='Halo '+(user?.email||'Driver')+' - Login OK!'
window.logout=async()=>{await supabase.auth.signOut();location.href='../login.html'}
<\/script></body></html>
