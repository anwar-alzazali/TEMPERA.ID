<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halaman Mitra</title>
<meta name="description" content="Halaman mitra pengemudi: profil, armada, dan pemesanan lewat WhatsApp.">
<link rel="icon" type="image/png" sizes="48x48" href="images/tempera-48.png">
<style>
:root{--accent:#0891b2;--on-accent:#fff;--bg:#f8fafc;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#17171a;--ink:#f4f4f5;--muted:#a1a1aa;--line:#2a2a2e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55}
main{max-width:640px;margin:0 auto;padding-bottom:48px}
.sampul{height:150px;background:var(--accent);background-size:cover;background-position:center}
.kepala{padding:0 18px;margin-top:-44px}
.avatar{width:88px;height:88px;border-radius:24px;border:4px solid var(--bg);background:var(--card);object-fit:cover;display:block}
.avatar.logo{object-fit:contain;padding:8px;background:#fff}
.avatar.kosong{display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:var(--accent)}
h1{margin:10px 0 0;font-size:24px;line-height:1.2}
.slogan{margin:4px 0 0;color:var(--muted);font-size:14px}
.kota{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.aksi{display:flex;gap:10px;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:14px;border:0;font-weight:800;font-size:14px;text-decoration:none;cursor:pointer;font-family:inherit}
.btn.utama{flex:1;background:var(--accent);color:var(--on-accent)}
.btn.tepi{flex:1;background:transparent;color:var(--ink);border:1px solid var(--line)}
section{margin:22px 18px 0}
h2{margin:0 0 10px;font-size:16px}
.bio{white-space:pre-line;color:var(--ink);font-size:14.5px}
.mobil{display:grid;gap:12px}
.kartu{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.kartu img,.kartu .foto0{width:120px;min-height:96px;object-fit:cover;flex:none;background:var(--line)}
.kartu .isi{padding:12px 12px 12px 0;min-width:0}
.kartu b{display:block;font-size:15px}
.kartu .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.kartu .harga{margin-top:8px;font-weight:800;color:var(--accent);font-size:15px}
form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
label{display:block;font-size:12px;font-weight:700;color:var(--muted)}
input,textarea,select{width:100%;margin-top:4px;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
textarea{resize:vertical}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{font-size:12px;color:var(--muted);margin:0}
.sosial{display:flex;flex-wrap:wrap;gap:8px}
.sosial a{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:13px;font-weight:700;text-decoration:none}
footer{text-align:center;color:var(--muted);font-size:12px;margin:30px 18px 0}
.tengah{padding:80px 20px;text-align:center;color:var(--muted)}
@media (max-width:420px){.dua{grid-template-columns:1fr}.kartu img,.kartu .foto0{width:96px}}
</style>
</head>
<body>
<main id="app"><div class="tengah">Memuat…</div></main>
<script>
const SB_URL = 'https://wjmotidelqgcyyujacud.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbW90aWRlbHFnY3l5dWphY3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE2ODIsImV4cCI6MjEwNDkwNzY4Mn0.kZVRZhw0ryUcT-Pb7akpaO6vR4gOGwCkpD1kvk_uRac';
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const aman = (u) => (/^https:\/\/[^\s"'<>]+$/i.test(String(u || '')) ? String(u) : '');
const rp = (v) => 'Rp ' + Number(v || 0).toLocaleString('id-ID');
const warnaOk = (w) => (/^#[0-9a-fA-F]{6}$/.test(String(w || '')) ? w : '#0891b2');
function teksDiAtas(hex) { const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255; return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#0f172a' : '#ffffff'; }
const slug = (new URLSearchParams(location.search).get('d') || '').toLowerCase();

async function muat() {
  const app = document.getElementById('app');
  if (!/^[a-z0-9][a-z0-9_-]{1,39}$/.test(slug)) { app.innerHTML = '<div class="tengah">Halaman tidak ditemukan.</div>'; return; }
  let h = null;
  try {
    const r = await fetch(`${SB_URL}/rest/v1/driver_halaman?slug=eq.${encodeURIComponent(slug)}&select=*&limit=1`, { headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}` } });
    if (r.ok) h = (await r.json())[0] || null;
  } catch (e) { console.warn(e); }
  if (!h) { app.innerHTML = '<div class="tengah">Halaman tidak ditemukan atau belum aktif.</div>'; return; }
  gambar(h);
}

function gambar(h) {
  const warna = warnaOk(h.warna);
  document.documentElement.style.setProperty('--accent', warna);
  document.documentElement.style.setProperty('--on-accent', teksDiAtas(warna));
  document.title = `${h.nama_tampil} · Sewa Mobil dengan Sopir`;
  const metaD = document.querySelector('meta[name="description"]'); if (metaD) metaD.content = `${h.nama_tampil}${h.kota ? ', ' + h.kota : ''}: profil, armada, dan pemesanan lewat WhatsApp.`;
  const sampul = aman(h.foto_sampul), adaLogo = !!aman(h.logo_url), foto = aman(h.logo_url) || aman(h.foto_profil);
  const mobil = (Array.isArray(h.mobil) ? h.mobil : []).filter((m) => m && m.jenis);
  const sos = h.sosial || {};
  const tautan = [['instagram', 'Instagram'], ['tiktok', 'TikTok'], ['facebook', 'Facebook']].filter(([k]) => aman(sos[k]));
  const wa = String(h.wa || '').replace(/\D/g, '');
  document.getElementById('app').innerHTML = `
    <div class="sampul" ${sampul ? `style="background-image:url('${esc(sampul)}')"` : ''}></div>
    <div class="kepala">
      ${foto ? `<img class="avatar${adaLogo ? ' logo' : ''}" src="${esc(foto)}" alt="${esc(h.nama_tampil)}">` : `<div class="avatar kosong">${esc(String(h.nama_tampil).slice(0, 1).toUpperCase())}</div>`}
      <h1>${esc(h.nama_tampil)}</h1>
      ${h.slogan ? `<p class="slogan">${esc(h.slogan)}</p>` : ''}
      ${h.kota ? `<span class="kota">${esc(h.kota)}</span>` : ''}
      <div class="aksi"><a class="btn utama" id="btnWA" href="#">Chat WhatsApp</a><a class="btn tepi" href="#pesan">Isi pemesanan</a></div>
    </div>
    ${h.bio ? `<section><h2>Tentang saya</h2><div class="bio">${esc(h.bio)}</div></section>` : ''}
    ${mobil.length ? `<section><h2>Armada</h2><div class="mobil">${mobil.map((m) => `<div class="kartu">${aman(m.foto) ? `<img src="${esc(aman(m.foto))}" alt="${esc(m.jenis)}" loading="lazy">` : '<div class="foto0"></div>'}
      <div class="isi"><b>${esc(m.jenis)}${m.tahun ? ' · ' + esc(m.tahun) : ''}</b><div class="sub">${m.kapasitas ? esc(m.kapasitas) + ' penumpang' : ''}</div>
      ${Number(m.harga_mulai) > 0 ? `<div class="harga">Mulai ${esc(rp(m.harga_mulai))}</div>` : ''}${m.harga_ket ? `<div class="sub">${esc(m.harga_ket)}</div>` : ''}</div></div>`).join('')}</div></section>` : ''}
    <section id="pesan"><h2>Pemesanan</h2>
      <form id="frm">
        <label>Nama Anda<input id="fNama" required maxlength="80" autocomplete="name"></label>
        <div class="dua"><label>Tanggal<input id="fTgl" type="date"></label><label>Jam jemput<input id="fJam" type="time"></label></div>
        <div class="dua"><label>Jumlah penumpang<input id="fPax" type="number" min="1" max="40" inputmode="numeric"></label>
          <label>Mobil<select id="fMobil"><option value="">Belum menentukan</option>${mobil.map((m) => `<option>${esc(m.jenis)}</option>`).join('')}</select></label></div>
        <label>Tujuan wisata<input id="fTujuan" maxlength="200" placeholder="mis. Lembang, Tangkuban Perahu"></label>
        <label>Titik jemput<input id="fJemput" maxlength="200"></label>
        <label>Catatan<textarea id="fCat" rows="2" maxlength="400"></textarea></label>
        <button class="btn utama" type="submit">Kirim lewat WhatsApp</button>
        <p class="cat">Tombol ini membuka WhatsApp dengan pesan yang sudah terisi, dikirim langsung ke ${esc(h.nama_tampil)}. Harga dan pembayaran disepakati langsung dengan pengemudi.</p>
      </form></section>
    ${tautan.length ? `<section><h2>Ikuti</h2><div class="sosial">${tautan.map(([k, l]) => `<a href="${esc(aman(sos[k]))}" target="_blank" rel="noopener">${l}</a>`).join('')}</div></section>` : ''}
    ${h.paket === 'pro' ? '' : '<footer>Halaman mitra · dibuat dengan Tempera</footer>'}`;
  const tulis = (teks) => `https://wa.me/${wa}?text=${encodeURIComponent(teks)}`;
  document.getElementById('btnWA').href = tulis(`Halo ${h.nama_tampil}, saya mau tanya sewa mobil.`);
  document.getElementById('btnWA').target = '_blank'; document.getElementById('btnWA').rel = 'noopener';
  const tgl = document.getElementById('fTgl'); tgl.min = new Date(Date.now() + 7 * 3600000).toISOString().slice(0, 10);
  document.getElementById('frm').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = (id) => document.getElementById(id).value.trim();
    const baris = [`Halo ${h.nama_tampil}, saya mau memesan:`, `Nama: ${v('fNama')}`];
    if (v('fTgl')) baris.push(`Tanggal: ${v('fTgl')}${v('fJam') ? ', jam ' + v('fJam') : ''}`);
    if (v('fPax')) baris.push(`Penumpang: ${v('fPax')} orang`);
    if (v('fMobil')) baris.push(`Mobil: ${v('fMobil')}`);
    if (v('fTujuan')) baris.push(`Tujuan: ${v('fTujuan')}`);
    if (v('fJemput')) baris.push(`Jemput di: ${v('fJemput')}`);
    if (v('fCat')) baris.push(`Catatan: ${v('fCat')}`);
    window.open(tulis(baris.join('\n')), '_blank', 'noopener');
  });
}
muat();
</script>
</body>
</html>
