<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#000; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;">
  <div style="text-align:center;" id="status">
    <p>Mengarahkan...</p>
  </div>

<script>
const SUPABASE_URL = "https://wjmotidelqgcyyujacud.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbW90aWRlbHFnY3l5dWphY3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE2ODIsImV4cCI6MjEwNDkwNzY4Mn0.kZVRZhw0ryUcT-Pb7akpaO6vR4gOGwCkpD1kvk_uRac"; // Gunakan anon key Anda
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const urlParams = new URLSearchParams(location.search);
const slug = urlParams.get('r') || location.pathname.split("/").filter(Boolean).pop();

async function trackAndRedirect() {
  if (slug) {
    try {
      // Mengisi semua kolom sesuai struktur tabel Supabase
      const { error } = await supabase
        .from('scans')
        .insert([{ 
          id: crypto.randomUUID(),
          driver_slug: slug, 
          ip_address: "Direct Scan", 
          user_agent: navigator.userAgent 
        }]);

      if (error) {
        console.error("Gagal simpan:", error.message);
      } else {
        console.log("Berhasil masuk!");
      }
    } catch (err) {
      console.error("Error:", err);
    }

    setTimeout(() => {
      location.href = "/?driver=" + slug;
    }, 600);
  } else {
    location.href = "/";
  }
}

trackAndRedirect();
</script>
</body>
</html>
