// Mengambil slug dari parameter ?r= atau dari path folder
const urlParams = new URLSearchParams(location.search);
const slug = urlParams.get('r') || location.pathname.split("/").filter(Boolean).pop();

async function go(){
  if(slug){
    try {
      const { error } = await supabase.from('scans').insert({driver_slug: slug});
      if (error) {
        alert("Error Supabase: " + error.message);
      }
    } catch(e) {
      alert("Error JS: " + e.message);
    }
    location.href = "/?driver=" + slug;
  } else {
    location.href = "/";
  }
}

setTimeout(go, 300);
</script>
