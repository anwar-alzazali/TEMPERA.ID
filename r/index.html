<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background:#000; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; font-family:sans-serif;">
  <div style="text-align:center;">
    <p>Memproses scan...</p>
  </div>

<script>
const SUPABASE_URL = "https://wjmotidelqgcyyujacud.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZWYiOiJ3am1vdGlkZWxxZ2N5eXVqYWN1ZCIsInJvbGUiOiJhbm9uIiwiaWF0Ijoi..."; // Gunakan anon key Anda
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const urlParams = new URLSearchParams(location.search);
const slug = urlParams.get('r') || location.pathname.split("/").filter(Boolean).pop();

async function trackAndRedirect() {
  if (slug) {
    try {
      // Mencatat data ke tabel scans
      const { data, error } = await supabase
        .from('scans')
        .insert([{ 
          driver_slug: slug, 
          user_agent: navigator.userAgent 
        }]);

      if (error) {
        // Jika gagal,unculkan pesan error-nya di layar HP Anda
        alert("Gagal Simpan Database: " + error.message);
        console.error("Supabase Error:", error);
      } else {
        console.log("Berhasil:", data);
      }
    } catch (err) {
      alert("Error Sistem: " + err.message);
    }

    // Tetap melakukan redirect setelah beberapa detik
    setTimeout(() => {
      location.href = "/?driver=" + slug;
    }, 1000);
  } else {
    location.href = "/";
  }
}

trackAndRedirect();
</script>
</body>
</html>
