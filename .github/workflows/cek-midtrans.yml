# .github/workflows/cek-midtrans.yml
# Pengecekan cadangan pembayaran Midtrans: tiap ~15 menit memanggil fungsi midtrans-cek di Supabase,
# yang menanyakan status pesanan 'pending' langsung ke Midtrans (kalau notifikasi Midtrans sempat tidak sampai).
# Butuh 1 rahasia di GitHub: MIDTRANS_CEK_KEY (nilainya SAMA dengan secret MIDTRANS_CEK_KEY di Supabase).
# Catatan: jadwal GitHub kadang terlambat beberapa menit; nanti dipindah ke Worker Cloudflare (Tahap 5).
name: Cek Midtrans

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: cek-midtrans
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Panggil midtrans-cek
        env:
          KEY: ${{ secrets.MIDTRANS_CEK_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::Rahasia MIDTRANS_CEK_KEY belum diisi"; exit 1; }
          code=$(curl -sS -o hasil.json -w '%{http_code}' -X POST \
            -H "x-cek-key: $KEY" -H 'Content-Type: application/json' -d '{}' \
            https://wjmotidelqgcyyujacud.supabase.co/functions/v1/midtrans-cek)
          cat hasil.json; echo
          [ "$code" = "200" ] || { echo "::error::midtrans-cek menjawab HTTP $code"; exit 1; }
