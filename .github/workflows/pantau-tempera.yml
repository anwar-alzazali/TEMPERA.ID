# .github/workflows/pantau-tempera.yml
# Memanggil fungsi "health" di Supabase tiap ~10 menit. Kalau status BERUBAH (sehat -> bermasalah,
# atau sebaliknya), kirim pesan ke Telegram. Tiap pagi jam 07.00 WIB kirim laporan harian
# (kalau laporan harian tidak datang, berarti pengawasnya sendiri yang bermasalah).
# Butuh 2 rahasia di GitHub: TELEGRAM_BOT_TOKEN dan TELEGRAM_CHAT_ID.
name: Pantau Tempera

on:
  schedule:
    - cron: '*/10 * * * *'   # tiap 10 menit (GitHub kadang terlambat beberapa menit)
    - cron: '0 0 * * *'      # 00.00 UTC = 07.00 WIB: laporan harian
  workflow_dispatch: {}      # tombol "Run workflow" untuk uji manual (mengirim laporan)

permissions:
  contents: read

concurrency:
  group: pantau-tempera
  cancel-in-progress: false

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ambil status terakhir
        uses: actions/cache/restore@v4
        with:
          path: .health-state
          key: health-state-${{ github.run_id }}
          restore-keys: health-state-

      - name: Periksa & kabari Telegram
        id: cek
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JADWAL: ${{ github.event.schedule }}
          PEMICU: ${{ github.event_name }}
          HEALTH_URL: https://wjmotidelqgcyyujacud.supabase.co/functions/v1/health
          # kunci publik (anon) yang sama dengan di js/main.js -- bukan rahasia
          ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbW90aWRlbHFnY3l5dWphY3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE2ODIsImV4cCI6MjEwNDkwNzY4Mn0.kZVRZhw0ryUcT-Pb7akpaO6vR4gOGwCkpD1kvk_uRac
        run: |
          set -u
          # buang spasi / baris baru yang tidak sengaja ikut saat rahasia ditempel
          TG_TOKEN=$(printf '%s' "${TG_TOKEN}" | tr -d '[:space:]')
          TG_TOKEN=${TG_TOKEN#bot}
          TG_CHAT=$(printf '%s' "${TG_CHAT}" | tr -d '[:space:]')
          kirim() {
            if [ -z "${TG_TOKEN}" ] || [ -z "${TG_CHAT}" ]; then
              echo "::warning::Rahasia TELEGRAM_BOT_TOKEN atau TELEGRAM_CHAT_ID kosong / belum diisi"; return 0
            fi
            balasan=$(curl -s --max-time 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" --data-urlencode "text=$1" || echo '{"ok":false,"description":"tidak bisa menghubungi Telegram"}')
            if printf '%s' "$balasan" | jq -e '.ok == true' > /dev/null 2>&1; then
              echo "Telegram: pesan terkirim"
            else
              echo "::warning::Telegram menolak: $(printf '%s' "$balasan" | jq -r '.description // "tanpa keterangan"' 2>/dev/null)"
            fi
          }
          waktu=$(TZ=Asia/Jakarta date '+%d-%m-%Y %H:%M WIB')
          lama=$(cat .health-state 2>/dev/null || echo "ok")

          rm -f hasil.json
          kode=$(curl -s -o hasil.json -w '%{http_code}' --max-time 30 \
            -H "apikey: ${ANON_KEY}" -H "Authorization: Bearer ${ANON_KEY}" "${HEALTH_URL}" || echo "000")

          if [ "$kode" = "200" ] && jq -e '.ok == true' hasil.json > /dev/null 2>&1; then
            baru="ok"; rincian=""
          else
            rincian=$(jq -r '.problems // [] | map("• " + .) | join("\n")' hasil.json 2>/dev/null || true)
            if [ -z "$rincian" ]; then
              rincian="• Server tidak menjawab dengan benar (HTTP ${kode}). Supabase mungkin mati atau dijeda."
              baru="server-tidak-menjawab"   # kode HTTP bisa berganti-ganti; cukup satu alarm
            else
              baru="$rincian"
            fi
          fi

          if [ "$baru" != "$lama" ]; then
            if [ "$baru" = "ok" ]; then
              kirim "$(printf '✅ TEMPERA PULIH\nSemua pemeriksaan kembali normal.\n%s' "$waktu")"
            else
              kirim "$(printf '🚨 TEMPERA BERMASALAH\n%s\n\n%s' "$rincian" "$waktu")"
            fi
            printf '%s' "$baru" > .health-state
            echo "ubah=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "$JADWAL" = "0 0 * * *" ] || [ "$PEMICU" = "workflow_dispatch" ]; then
            kuota=$(jq -r '.info.fonnte.quota // "-"' hasil.json 2>/dev/null || echo "-")
            akhir=$(jq -r '.info.fonnte.expired // "-"' hasil.json 2>/dev/null || echo "-")
            wa=$(jq -r '.info.fonnte.device_status // "-"' hasil.json 2>/dev/null || echo "-")
            if [ "$baru" = "ok" ]; then status="✅ Semua normal"; else status=$(printf '⚠️ Ada masalah:\n%s' "$rincian"); fi
            kirim "$(printf '📋 Laporan harian Tempera\n%s\nWA Fonnte: %s | kuota %s | berakhir %s\n%s' "$status" "$wa" "$kuota" "$akhir" "$waktu")"
          fi

      - name: Simpan status baru
        if: steps.cek.outputs.ubah == 'true'
        uses: actions/cache/save@v4
        with:
          path: .health-state
          key: health-state-${{ github.run_id }}
