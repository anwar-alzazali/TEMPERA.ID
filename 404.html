<!<!DOCTYPE html><html><head><meta charset="UTF-8">
<script>
// Fix GitHub Pages SPA untuk tempera.id
const path = window.location.pathname;
const host = window.location.host;
const isCustomDomain = host.includes('tempera.id');

// Base path - kalau di github.io ada /TEMPERA.ID, kalau di tempera.id kosong
const base = isCustomDomain? '' : '/TEMPERA.ID';

if(path.includes('/r/')){
  const slug = path.split('/r/')[1].split('/')[0].split('?')[0];
  if(slug && slug!== 'index.html' && slug!== ''){
    location.replace(base + '/r/index.html?r=' + slug);
  } else {
    location.replace(base + '/r/index.html');
  }
} else if(path.includes('/driver/')){
  const slug = path.split('/driver/')[1].split('/')[0].split('?')[0];
  if(slug && slug!== 'index.html' && slug!== ''){
    location.replace(base + '/driver/index.html?driver=' + slug);
  } else {
    location.replace(base + '/driver/index.html');
  }
} else {
  location.replace(base + '/index.html');
}
</script>

<script>
// GitHub Pages 404 trick untuk handle /r/udin
// Kalau user buka /TEMPERA.ID/r/udin tapi file gak ada, GitHub akan load 404.html ini
// Kita redirect ke handler yang sebenarnya
const path = window.location.pathname;
if(path.includes('/r/')){
  const slug = path.split('/r/')[1].split('/').filter(Boolean)[0];
  if(slug && slug !== 'index.html'){
    // simpan slug dan redirect ke /r/index.html?r=slug
    const base = path.split('/r/')[0] + '/r/';
    location.replace(base + '?r=' + slug);
  } else {
    location.replace(path.split('/r/')[0] + '/index.html');
  }
} else {
  location.replace('/TEMPERA.ID/index.html');
}
</script>
