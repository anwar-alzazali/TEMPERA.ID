<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redirecting...</title>
<script>
const path = window.location.pathname;
const host = window.location.host;
const isCustom = host.includes('tempera.id');
const base = isCustom? '' : '/TEMPERA.ID';
if(path.includes('/r/')){
  const slug = path.split('/r/')[1].split('/')[0].split('?')[0].split('#')[0];
  if(slug && slug!='index.html' && slug!=''){
    location.replace(base + '/r/index.html?r=' + slug);
  } else {
    location.replace(base + '/r/index.html');
  }
} else if(path.includes('/driver/')){
  const slug = path.split('/driver/')[1].split('/')[0].split('?')[0].split('#')[0];
  if(slug && slug!='index.html' && slug!=''){
    location.replace(base + '/driver/index.html?driver=' + slug);
  } else {
    location.replace(base + '/driver/index.html');
  }
} else {
  location.replace(base + '/index.html');
}
</script></head><body>Redirecting...</body></html>
