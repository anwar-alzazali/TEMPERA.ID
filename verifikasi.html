<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Verifikasi</title>
<style>
  :root{
    --accent:#0891b2;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --bg:#f1f5f9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:480px;margin:0 auto;padding:20px 16px 40px}
  #card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 24px rgba(15,23,42,.08)}

  .band{background:var(--accent);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:10px}
  .band img{height:26px;width:auto;max-width:70px;object-fit:contain}
  .band span{font-size:11px;font-weight:800;letter-spacing:.1em;opacity:.92}

  .hero{padding:26px 20px 18px;text-align:center}
  .icon{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:30px}
  .icon.ok{background:#dcfce7;color:#166534}
  .icon.bad{background:#fee2e2;color:#991b1b}
  .icon.warn{background:#fef3c7;color:#92400e}
  .icon.grey{background:#e2e8f0;color:#475569}
  .title{font-size:18px;font-weight:800}
  .sub{color:var(--muted);font-size:12.5px;margin-top:4px}

  .body{padding:0 20px 22px}
  .photo{width:76px;height:76px;border-radius:50%;margin:0 auto 10px;overflow:hidden;border:3px solid var(--accent);background:var(--accent);display:flex;align-items:center;justify-content:center}
  .photo img{width:100%;height:100%;object-fit:cover}
  .photo .init{color:#fff;font-size:26px;font-weight:800}

  dl.det{display:grid;grid-template-columns:110px 1fr;gap:7px 12px;margin:0}
  dl.det dt{color:var(--muted);font-size:11.5px}
  dl.det dd{margin:0;font-weight:600}
  .sec{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
  .sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .route{list-style:none;margin:0;padding:0;font-size:13px}
  .route li{padding:3px 0}
  .route b{color:var(--accent)}

  .plate{display:inline-block;margin-top:2px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:14px;letter-spacing:.06em;border:2px solid var(--ink);border-radius:7px;padding:2px 10px}

  .foot{padding:14px 20px;background:#f8fafc;text-align:center;color:var(--muted);font-size:11px}
  .time{text-align:center;color:var(--muted);font-size:11px;margin-top:14px}
  .state-page{background:#fff;border-radius:18px;padding:40px 20px;text-align:center;color:var(--muted)}
  .state-page.err{color:#b91c1c}
</style>
</head>
<body>
<div class="wrap"><div id="root"><div class="state-page">Memeriksa&hellip;</div></div></div>

<script>
const SB_URL = 'https://wjmotidelqgcyyujacud.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbW90aWRlbHFnY3l5dWphY3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE2ODIsImV4cCI6MjEwNDkwNzY4Mn0.kZVRZhw0ryUcT-Pb7akpaO6vR4gOGwCkpD1kvk_uRac';
const WILAYAH = { lembang: 'Lembang', dago: 'Dago', ciwidey: 'Ciwidey', pangalengan: 'Pangalengan' };
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const FALLBACK_CO = { name: 'Tempera', tagline: '', logo_url: '', site_url: '' };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function imgSrc(u, site) {
  if (!u) return '';
  if (/^(https?:|data:)/i.test(u)) return u;
  return (site ? site + '/' : '') + u.replace(/^\/+/, '');
}
function initials(name) {
  const w = String(name || '').trim().split(/\s+/).filter(Boolean);
  return ((w[0] || '')[0] || '?').toUpperCase() + ((w[1] || '')[0] || '').toUpperCase();
}
function tglPanjang(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso || ''));
  return m ? `${+m[3]} ${BULAN[+m[2] - 1]} ${m[1]}` : (iso || '-');
}
function waktuWIB(iso) {
  if (!iso) return '-';
  try { return new Date(iso).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' WIB'; }
  catch (_e) { return String(iso); }
}
// Logo satu warna putih di atas band, sama seperti surat jalan & kartu.
function tintLogo(url, color) {
  return new Promise((resolve) => {
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      try {
        const k = Math.min(1, 300 / Math.max(im.naturalWidth, im.naturalHeight));
        const w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d'); x.drawImage(im, 0, 0, w, h);
        const px = x.getImageData(0, 0, w, h).data;
        let x0 = w, y0 = h, x1 = -1, y1 = -1;
        for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
          if (px[(yy * w + xx) * 4 + 3] > 8) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; }
        }
        if (x1 < 0) return resolve('');
        const c2 = document.createElement('canvas'); c2.width = x1 - x0 + 1; c2.height = y1 - y0 + 1;
        const x2 = c2.getContext('2d');
        x2.drawImage(c, x0, y0, c2.width, c2.height, 0, 0, c2.width, c2.height);
        x2.globalCompositeOperation = 'source-in'; x2.fillStyle = color; x2.fillRect(0, 0, c2.width, c2.height);
        resolve(c2.toDataURL('image/png'));
      } catch (_e) { resolve(''); }
    };
    im.onerror = () => resolve('');
    im.src = url;
  });
}

function band(co) {
  const logo = co.logo_url ? `<img id="bandlogo" src="${esc(imgSrc(co.logo_url, co.site_url))}" crossorigin="anonymous" alt="">` : '';
  return `<div class="band">${logo}<span>VERIFIKASI ${esc((co.name || 'TEMPERA').toUpperCase())}</span></div>`;
}
function heroIcon(kind, glyph) { return `<div class="icon ${kind}">${glyph}</div>`; }

// ---------- tampilan hasil verifikasi SURAT JALAN ----------
function suratView(d) {
  const co = d.company || FALLBACK_CO;
  if (d.status === 'tidak_valid' || d.status === 'kedaluwarsa_qr') {
    return `${band(co)}<div class="hero">${heroIcon('bad', '&times;')}<div class="title">Kode Tidak Valid</div><div class="sub">Surat jalan ini tidak dapat diverifikasi. Kemungkinan tautan salah atau rusak.</div></div>`;
  }
  if (d.status === 'diganti') {
    return `${band(co)}<div class="hero">${heroIcon('warn', '&#8635;')}<div class="title">Surat Sudah Diganti</div>
      <div class="sub">${esc(d.sj_no)} revisi ${esc(d.rev)} sudah tidak berlaku.<br>Revisi terbaru: <b>Rev ${esc(d.rev_terbaru)}</b>. Minta driver menunjukkan surat terbaru.</div></div>`;
  }

  const s = d.surat, dr = d.driver;
  const cfg = {
    sah:            { kind: 'ok',   glyph: '&#10003;', title: 'Surat Jalan Sah' },
    dibatalkan:     { kind: 'bad',  glyph: '&times;',  title: 'Dibatalkan' },
    tidak_berlaku:  { kind: 'bad',  glyph: '&times;',  title: 'Tidak Berlaku' },
    lewat:          { kind: 'grey', glyph: '&#8987;',  title: 'Trip Sudah Lewat' },
    driver_nonaktif:{ kind: 'warn', glyph: '&#9888;',  title: 'Driver Tidak Aktif' },
  }[d.status] || { kind: 'grey', glyph: '?', title: d.status };

  const nodes = Object.keys(WILAYAH)
    .filter((k) => Array.isArray(s.destinations[k]) && s.destinations[k].length)
    .map((k) => `<li><b>${WILAYAH[k]}:</b> ${s.destinations[k].map(esc).join(', ')}</li>`).join('');

  const photo = dr.photo_url
    ? `<img src="${esc(imgSrc(dr.photo_url, co.site_url))}" alt="" crossorigin="anonymous">`
    : `<span class="init">${esc(initials(dr.name))}</span>`;

  return `${band(co)}
    <div class="hero">${heroIcon(cfg.kind, cfg.glyph)}<div class="title">${cfg.title}</div>
      <div class="sub">${esc(s.sj_no)} &middot; Rev ${esc(s.rev)}${d.hari_ini ? ' &middot; Trip hari ini' : ''}</div></div>
    <div class="body">
      <div class="photo">${photo}</div>
      <dl class="det">
        <dt>Mitra pengemudi</dt><dd>${esc(dr.name || '-')} (${esc(dr.code || '-')})</dd>
        <dt>Kendaraan</dt><dd>${esc(dr.vehicle_type || '-')}</dd>
        <dt>Plat nomor</dt><dd><span class="plate">${esc(dr.plate || '-')}</span></dd>
      </dl>
      <div class="sec">
        <h3>Perjalanan</h3>
        <dl class="det">
          <dt>Pemesan</dt><dd>${esc(s.customer_name || '-')}</dd>
          <dt>Tanggal</dt><dd>${esc(tglPanjang(s.trip_date))}, ${esc(s.trip_time || '-')}</dd>
          <dt>Peserta</dt><dd>${esc(s.pax != null ? s.pax : '-')} orang</dd>
          <dt>Armada</dt><dd>${esc(s.fleet_name || '-')}</dd>
        </dl>
      </div>
      ${nodes ? `<div class="sec"><h3>Destinasi</h3><ul class="route">${nodes}</ul></div>` : ''}
    </div>
    <div class="time">Diperiksa ${esc(waktuWIB(d.cek_pada))}</div>`;
}

// ---------- tampilan hasil verifikasi ID CARD DRIVER ----------
function driverView(d) {
  const co = d.company || FALLBACK_CO;
  if (d.status === 'tidak_valid') {
    return `${band(co)}<div class="hero">${heroIcon('bad', '&times;')}<div class="title">Kode Tidak Valid</div><div class="sub">Kartu ini tidak dapat diverifikasi.</div></div>`;
  }
  if (d.status === 'kedaluwarsa_qr') {
    return `${band(co)}<div class="hero">${heroIcon('grey', '&#8987;')}<div class="title">Kode Sudah Kedaluwarsa</div><div class="sub">Minta driver membuka ulang kartunya lalu pindai kode yang baru.</div></div>`;
  }

  const dr = d.driver;
  const cfg = {
    aktif:      { kind: 'ok',   glyph: '&#10003;', title: 'Mitra Aktif' },
    nonaktif:   { kind: 'bad',  glyph: '&times;',  title: 'Mitra Tidak Aktif' },
    masa_habis: { kind: 'warn', glyph: '&#9888;',  title: 'Masa Berlaku Kartu Habis' },
  }[d.status] || { kind: 'grey', glyph: '?', title: d.status };

  const photo = dr.photo_url
    ? `<img src="${esc(imgSrc(dr.photo_url, co.site_url))}" alt="" crossorigin="anonymous">`
    : `<span class="init">${esc(initials(dr.name))}</span>`;

  return `${band(co)}
    <div class="hero">${heroIcon(cfg.kind, cfg.glyph)}<div class="title">${cfg.title}</div></div>
    <div class="body">
      <div class="photo">${photo}</div>
      <dl class="det">
        <dt>Nama</dt><dd>${esc(dr.name || '-')}</dd>
        <dt>ID Mitra</dt><dd>${esc(dr.code || '-')}</dd>
        <dt>Kendaraan</dt><dd>${esc(dr.vehicle_type || '-')}</dd>
        <dt>Plat nomor</dt><dd><span class="plate">${esc(dr.plate || '-')}</span></dd>
      </dl>
    </div>
    <div class="time">Diperiksa ${esc(waktuWIB(d.cek_pada))}</div>`;
}

async function tintAll() {
  const lg = document.getElementById('bandlogo');
  if (!lg) return;
  const u = await tintLogo(lg.src, '#ffffff');
  if (u) lg.src = u;
}

async function load() {
  const root = document.getElementById('root');
  const p = new URLSearchParams(location.search);
  let url;
  if (p.get('n')) {
    url = `${SB_URL}/functions/v1/verifikasi?n=${encodeURIComponent(p.get('n'))}&r=${encodeURIComponent(p.get('r') || '')}&c=${encodeURIComponent(p.get('c') || '')}`;
  } else if (p.get('d')) {
    url = `${SB_URL}/functions/v1/verifikasi?d=${encodeURIComponent(p.get('d'))}&w=${encodeURIComponent(p.get('w') || '')}&s=${encodeURIComponent(p.get('s') || '')}`;
  } else {
    root.innerHTML = '<div id="card"><div class="state-page err">Kode verifikasi tidak lengkap.</div></div>';
    return;
  }
  try {
    const r = await fetch(url, { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } });
    const d = await r.json();
    if (!d.ok) { root.innerHTML = `<div id="card"><div class="state-page err">${esc(d.error || 'Gagal memeriksa kode.')}</div></div>`; return; }
    const html = d.jenis === 'driver' ? driverView(d) : suratView(d);
    root.innerHTML = `<div id="card">${html}<div class="foot">Halaman ini menampilkan hasil pemeriksaan resmi dari sistem ${esc((d.company && d.company.name) || 'Tempera')}.</div></div>`;
    await tintAll();
  } catch (e) {
    console.error(e);
    root.innerHTML = '<div id="card"><div class="state-page err">Gagal memeriksa kode. Periksa koneksi internet lalu muat ulang.</div></div>';
  }
}
load();
</script>
</body>
</html>
