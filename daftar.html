<html lang="id">
<head><style>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Driver - TEMPERA.ID - HQ 0.82</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.8/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}
body{background:#f6f7f9;margin:0;padding:16px}
.card{max-width:480px;margin:0 auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#666;font-size:13px;margin-bottom:16px}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px}
.preview{width:110px;height:110px;border-radius:50%;object-fit:cover;display:none;margin-top:10px;border:3px solid #eee}
.btn{width:100%;margin-top:18px;background:#0891b2;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.5}
.ok{background:#e6f9ec;color:#0a7a2a;padding:12px;border-radius:12px;margin-top:14px;display:none;text-align:center}
.hint{font-size:11px;color:#888;margin-top:6px}
</style>
</head>
<body>
<div class="card">
<h1>Daftar Mitra Driver TEMPERA.ID</h1>
<div class="sub">Isi data di bawah. Kode ID dan link driver dibuat otomatis oleh admin saat pendaftaranmu disetujui.</div>

<label for="name">Nama Lengkap</label>
<input id="name" placeholder="Anwar Alzazali" maxlength="40" autocomplete="name">

<label for="phone">No WA</label>
<input id="phone" placeholder="0812xxxx" inputmode="numeric" maxlength="18">

<label for="vehicle">Tipe Mobil</label>
<select id="vehicle">
<option>Avanza</option>
<option>Xenia</option>
<option>Innova</option>
<option>Hiace 15 Seat</option>
<option>Elf Long</option>
<option>Bus Medium</option>
</select>

<label for="plate">Plat Nomor</label>
<input id="plate" placeholder="D 1234 AA" maxlength="12">

<label for="photo">Foto Selfie (buat kartu ID) *wajib</label>
<input type="file" id="photo" accept="image/jpeg,image/jpg,image/png,image/webp">
<div class="hint">Bisa dari Kamera atau Galeri. Foto besar (20MB+) otomatis dikompres kualitas tinggi 0.82 — tetap tajam saat dicetak 300 DPI.</div>
<img id="preview" class="preview" alt="Preview foto">

<button class="btn" id="btnSubmit" type="button">Kirim Pendaftaran</button>
<div class="ok" id="okMsg">✅ Terkirim! Menunggu persetujuan Admin.</div>
</div>

<script>
(function(){
'use strict';
const supabaseUrl = "https://wjmotidelqgcyyujacud.supabase.co";
const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbW90aWRlbHFnY3l5dWphY3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE2ODIsImV4cCI6MjEwNDkwNzY4Mn0.kZVRZhw0ryUcT-Pb7akpaO6vR4gOGwCkpD1kvk_uRac";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

const photoInput = document.getElementById('photo');
const preview = document.getElementById('preview');
let currentPreviewUrl = null;

function sanitizeText(s, max){ return String(s||'').trim().slice(0,max).replace(/[<>"]/g,''); }
function sanitizePhone(s){ return String(s||'').replace(/[^0-9+]/g,'').slice(0,18); }

photoInput.addEventListener('change', () => {
  const f = photoInput.files[0];
  if (!f) return;
  if (!f.type.startsWith('image/')){ alert('File harus gambar.'); photoInput.value=''; return; }
  if (currentPreviewUrl) URL.revokeObjectURL(currentPreviewUrl);
  currentPreviewUrl = URL.createObjectURL(f);
  preview.src = currentPreviewUrl;
  preview.style.display = 'block';
});

async function kecilkanFoto(file){
  const QUALITY = 0.82;
  const MAX_SISI = 1200;
  try{
    if(window.createImageBitmap){
      const bmp = await createImageBitmap(file, {imageOrientation:'from-image'});
      const skala = Math.min(1, MAX_SISI / Math.max(bmp.width, bmp.height));
      const w = Math.round(bmp.width * skala), h = Math.round(bmp.height * skala);
      const c = document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(bmp,0,0,w,h);
      bmp.close();
      const blob = await new Promise(res=>c.toBlob(res,'image/jpeg',QUALITY));
      return blob || file;
    }
  }catch(_e){}
  return new Promise((resolve)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      const skala = Math.min(1, MAX_SISI / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth*skala), h = Math.round(img.naturalHeight*skala);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob((blob)=>resolve(blob||file),'image/jpeg',QUALITY);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

document.getElementById('btnSubmit').addEventListener('click', async ()=>{
  const name = sanitizeText(document.getElementById('name').value,40);
  const phone = sanitizePhone(document.getElementById('phone').value);
  const vehicle = document.getElementById('vehicle').value;
  const plate = sanitizeText(document.getElementById('plate').value,12).toUpperCase();
  const file = photoInput.files[0];
  if(!name || phone.length<10 || !file){ alert('Lengkapi nama, WA minimal 10 digit, dan foto!'); return; }
  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; 
  btn.textContent = `Mengompres foto ${(file.size/1024/1024).toFixed(1)}MB ke kualitas 0.82...`;
  let fileName = null;
  try{
    const kecil = await kecilkanFoto(file);
    console.log(`Asli: ${(file.size/1024/1024).toFixed(1)}MB -> Kompres 0.82: ${(kecil.size/1024/1024).toFixed(1)}MB`);
    const safeName = name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'').slice(0,20);
    fileName = 'pending-' + Date.now() + '-' + safeName + '.jpg';
    btn.textContent = 'Mengunggah foto...';
    const { error: upErr } = await supabaseClient.storage.from('driver-photos').upload(fileName, kecil, { contentType: 'image/jpeg', upsert:false });
    if(upErr) throw upErr;
    const { data: urlData } = supabaseClient.storage.from('driver-photos').getPublicUrl(fileName);
    const photo_url = urlData.publicUrl;
    btn.textContent = 'Mengirim pendaftaran...';
    const { error: dbErr } = await supabaseClient.from('drivers_pending').insert({ name, phone, vehicle_type: vehicle, plate, photo_url });
    if(dbErr){ await supabaseClient.storage.from('driver-photos').remove([fileName]); throw dbErr; }
    document.getElementById('okMsg').style.display = 'block';
    btn.textContent = '✅ Terkirim';
  }catch(e){
    alert('Gagal: ' + (e.message||e));
    console.error(e);
    if(fileName){ try{ await supabaseClient.storage.from('driver-photos').remove([fileName]); }catch(_){} }
    btn.disabled = false; btn.textContent = 'Kirim Pendaftaran';
  }
});
})();
</script>
