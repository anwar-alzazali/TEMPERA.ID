<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Driver - TEMPERA.ID</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}
body{background:#f6f7f9;margin:0;padding:16px}
.card{max-width:480px;margin:0 auto;background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}
.sub{color:#666;font-size:13px;margin-bottom:16px}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:15px}
.preview{width:110px;height:110px;border-radius:50%;object-fit:cover;display:none;margin-top:10px;border:3px solid #eee}
.btn{width:100%;margin-top:18px;background:#0891b2;color:#fff;border:0;padding:14px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.5}
.ok{background:#e6f9ec;color:#0a7a2a;padding:12px;border-radius:12px;margin-top:14px;display:none;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>Daftar Mitra Driver TEMPERA.ID</h1>
<div class="sub">Isi data di bawah. Kode ID dan link driver dibuat otomatis oleh admin saat pendaftaranmu disetujui.</div>

<label>Nama Lengkap</label>
<input id="name" placeholder="Anwar Alzazali">

<label>No WA</label>
<input id="phone" placeholder="0812xxxx">

<label>Tipe Mobil</label>
<select id="vehicle">
<option>Avanza</option>
<option>Xenia</option>
<option>Innova</option>
<option>Hiace 15 Seat</option>
<option>Elf Long</option>
<option>Bus Medium</option>
</select>

<label>Plat Nomor</label>
<input id="plate" placeholder="D 1234 AA">

<label>Foto Selfie (buat kartu ID) *wajib</label>
<input type="file" id="photo" accept="image/*" capture="user">
<img id="preview" class="preview">

<button class="btn" id="btnSubmit" type="button">Kirim Pendaftaran</button>
<div class="ok" id="okMsg">✅ Terkirim! Menunggu persetujuan Admin.</div>
</div>

<script>
const supabaseUrl = "https://wjmotidelqgcyyujacud.supabase.co";
const supabaseAnonKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbW90aWRlbHFnY3l5dWphY3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE2ODIsImV4cCI6MjEwNDkwNzY4Mn0.kZVRZhw0ryUcT-Pb7akpaO6vR4gOGwCkpD1kvk_uRac";
const supabaseClient = supabase.createClient(supabaseUrl, supabaseAnonKey);

const photoInput = document.getElementById('photo');
const preview = document.getElementById('preview');
photoInput.addEventListener('change', () => {
  const f = photoInput.files[0];
  if (!f) return;
  preview.src = URL.createObjectURL(f);
  preview.style.display = 'block';
});

// Foto kamera HP bisa 8-20 MB dan melebihi batas ukuran Supabase. Diperkecil dulu di HP
// (maks. 1200px, kualitas 82%) sebelum diunggah, hasilnya biasanya di bawah 1-2 MB.
function kecilkanFoto(file) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const maxSisi = 1200;
      const skala = Math.min(1, maxSisi / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * skala), h = Math.round(img.naturalHeight * skala);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob((blob) => resolve(blob || file), 'image/jpeg', 0.82);
    };
    img.onerror = () => resolve(file); // gagal diproses: pakai file asli apa adanya
    img.src = url;
  });
}

document.getElementById('btnSubmit').addEventListener('click', async () => {
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const vehicle = document.getElementById('vehicle').value;
  const plate = document.getElementById('plate').value.trim();
  const file = photoInput.files[0];

  if (!name || !phone || !file) { alert('Lengkapi nama, WA, dan foto!'); return; }

  const btn = document.getElementById('btnSubmit');
  btn.disabled = true; btn.textContent = 'Mengunggah foto...';

  try {
    const kecil = await kecilkanFoto(file);
    const safeName = name.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
    // Awalan "pending-" wajib -- itu yang membuat izin unggah publik berlaku (lihat policy Storage).
    // Selalu .jpg karena kecilkanFoto() mengubah semua foto jadi JPEG.
    const fileName = 'pending-' + Date.now() + '-' + safeName + '.jpg';

    const { error: upErr } = await supabaseClient.storage.from('driver-photos')
      .upload(fileName, kecil, { contentType: 'image/jpeg' });
    if (upErr) throw upErr;

    const { data: urlData } = supabaseClient.storage.from('driver-photos').getPublicUrl(fileName);
    const photo_url = urlData.publicUrl;

    btn.textContent = 'Mengirim pendaftaran...';
    const { error: dbErr } = await supabaseClient.from('drivers_pending').insert({
      name: name,
      phone: phone,
      vehicle_type: vehicle,
      plate: plate,
      photo_url: photo_url
    });
    if (dbErr) throw dbErr;

    document.getElementById('okMsg').style.display = 'block';
    btn.textContent = '✅ Terkirim';
  } catch (e) {
    alert('Gagal: ' + e.message);
    console.error(e);
    btn.disabled = false; btn.textContent = 'Kirim Pendaftaran';
  }
});
</script>
</body>
</html>
