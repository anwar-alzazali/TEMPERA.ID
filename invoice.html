<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Invoice</title>
<style>
  :root{
    --accent:#0891b2;      /* warna utama invoice */
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --bg:#f1f5f9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-bottom:12px}
  .btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:13px;cursor:pointer}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.6;cursor:wait}

  #invoice{background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 24px rgba(15,23,42,.08)}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:20px;border-bottom:3px solid var(--accent)}
  .brand{display:flex;gap:14px;align-items:center}
  .brand img{height:56px;width:auto;max-width:120px;object-fit:contain}
  .brand-name{font-size:20px;font-weight:800;letter-spacing:.02em}
  .brand-sub{color:var(--muted);font-size:12px}
  .inv-title{text-align:right}
  .inv-title h1{margin:0;font-size:26px;letter-spacing:.12em;color:var(--accent)}
  .inv-no{font-weight:700}
  .badge{display:inline-block;margin-top:6px;padding:4px 14px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:800;font-size:12px;letter-spacing:.08em}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0}
  .box h3{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .box p{margin:0}
  .box .strong{font-weight:700}

  table{width:100%;border-collapse:collapse;margin-top:6px}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  td.num,th.num{text-align:right;white-space:nowrap}
  tr.total td{border-bottom:0;border-top:2px solid var(--ink);font-weight:800;font-size:16px}
  .disc{color:#166534}

  .dest{margin:6px 0 0;padding:0;list-style:none}
  .dest li{padding:3px 0}
  .dest b{color:var(--accent)}
  .note{margin-top:22px;padding:12px 14px;border-radius:10px;background:#f8fafc;color:var(--muted);font-size:12px}
  .foot{margin-top:22px;text-align:center;color:var(--muted);font-size:12px}
  .state{background:#fff;border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}
  .state.err{color:#b91c1c}

  @media (max-width:560px){
    #invoice{padding:20px}
    .head{flex-direction:column}
    .inv-title{text-align:left}
    .grid{grid-template-columns:1fr}
  }
  @media print{
    body{background:#fff}
    .wrap{padding:0;max-width:none}
    .actions{display:none}
    #invoice{box-shadow:none;border-radius:0;padding:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="actions" id="actions" style="display:none">
    <button class="btn btn-ghost" id="btnPrint" type="button">Cetak</button>
    <button class="btn btn-primary" id="btnPdf" type="button">Simpan PDF</button>
  </div>
  <div id="root"><div class="state">Memuat invoice…</div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script>
// Alamat function & kunci publik (anon key aman ditaruh di sini, sama seperti di main.js)
const SB_URL = 'https://wjmotidelqgcyyujacud.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbW90aWRlbHFnY3l5dWphY3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE2ODIsImV4cCI6MjEwNDkwNzY4Mn0.kZVRZhw0ryUcT-Pb7akpaO6vR4gOGwCkpD1kvk_uRac';

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const WILAYAH = { lembang:'Lembang', dago:'Dago', ciwidey:'Ciwidey', pangalengan:'Pangalengan' };
const METODE = { qris:'QRIS', bank_transfer:'Transfer Bank', credit_card:'Kartu Kredit', gopay:'GoPay', shopeepay:'ShopeePay', cstore:'Gerai Retail', akulaku:'Akulaku', echannel:'Mandiri Bill' };

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = (v) => 'Rp ' + Number(v || 0).toLocaleString('id-ID');

function tglPanjang(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  return m ? `${+m[3]} ${BULAN[+m[2] - 1]} ${m[1]}` : (s || '-');
}
function waktuBayar(iso) {
  if (!iso) return '-';
  try {
    return new Date(iso).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' WIB';
  } catch (_e) { return String(iso); }
}
function imgSrc(u) { return /^https?:\/\//i.test(u) ? u : u; }

function buildInvoice(d) {
  const inv = d.invoice, co = d.company;

  const logo = co.logo_url ? `<img src="${esc(imgSrc(co.logo_url))}" alt="${esc(co.name)}" crossorigin="anonymous">` : '';
  const alamat = [co.address, co.contact].filter(Boolean).map(esc).join('<br>');

  const destItems = Object.keys(WILAYAH)
    .filter((k) => Array.isArray(inv.destinations[k]) && inv.destinations[k].length)
    .map((k) => `<li><b>${WILAYAH[k]}:</b> ${inv.destinations[k].map(esc).join(', ')}</li>`)
    .join('');

  const rows = [`<tr><td>${esc(inv.fleet_name || 'Sewa mobil')}</td><td class="num">${rp(inv.base_price)}</td></tr>`];
  if (Number(inv.cross_cost) > 0) rows.push(`<tr><td>Biaya lintas wilayah</td><td class="num">${rp(inv.cross_cost)}</td></tr>`);
  if (Number(inv.discount) > 0) rows.push(`<tr><td class="disc">Diskon</td><td class="num disc">- ${rp(inv.discount)}</td></tr>`);
  rows.push(`<tr class="total"><td>Total dibayar</td><td class="num">${rp(inv.total)}</td></tr>`);

  return `
  <div id="invoice">
    <div class="head">
      <div class="brand">${logo}<div>
        <div class="brand-name">${esc(co.name)}</div>
        <div class="brand-sub">${esc(co.tagline)}</div>
      </div></div>
      <div class="inv-title">
        <h1>INVOICE</h1>
        <div class="inv-no">${esc(inv.invoice_no || '-')}</div>
        <span class="badge">LUNAS</span>
      </div>
    </div>

    <div class="grid">
      <div class="box">
        <h3>Ditagihkan kepada</h3>
        <p class="strong">${esc(inv.customer_name)}</p>
        <p>WhatsApp ${esc(inv.customer_wa)}</p>
      </div>
      <div class="box">
        <h3>Detail pembayaran</h3>
        <p>Order: ${esc(inv.order_id)}</p>
        <p>Dibayar: ${esc(waktuBayar(inv.paid_at))}</p>
        <p>Metode: ${esc(METODE[inv.payment_type] || (inv.payment_type ? String(inv.payment_type).toUpperCase() : '-'))}</p>
      </div>
    </div>

    <div class="grid">
      <div class="box">
        <h3>Perjalanan</h3>
        <p><span class="strong">${esc(tglPanjang(inv.trip_date))}</span>${inv.trip_time ? ', jam ' + esc(inv.trip_time) : ''}</p>
        <p>${esc(inv.pax != null ? inv.pax : '-')} peserta</p>
        <p>Titik jemput: ${esc(inv.pickup_note || '-')}</p>
      </div>
      <div class="box">
        <h3>Destinasi</h3>
        <ul class="dest">${destItems || '<li>-</li>'}</ul>
      </div>
    </div>

    <table>
      <thead><tr><th>Keterangan</th><th class="num">Jumlah</th></tr></thead>
      <tbody>${rows.join('')}</tbody>
    </table>

    ${co.footer ? `<div class="note">${esc(co.footer)}</div>` : ''}
    <div class="foot">${alamat}${alamat ? '<br>' : ''}Terima kasih telah memilih ${esc(co.name)}.</div>
  </div>`;
}

async function load() {
  const root = document.getElementById('root');
  const t = new URLSearchParams(location.search).get('t') || '';
  if (!/^[a-f0-9]{32}$/i.test(t)) {
    root.innerHTML = '<div class="state err">Link invoice tidak valid.</div>';
    return;
  }
  try {
    const r = await fetch(`${SB_URL}/functions/v1/get-invoice?t=${encodeURIComponent(t)}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const d = await r.json();
    if (!d.ok) {
      root.innerHTML = `<div class="state err">${esc(d.error || 'Invoice tidak dapat dibuka.')}</div>`;
      return;
    }
    root.innerHTML = buildInvoice(d);
    document.title = 'Invoice ' + (d.invoice.invoice_no || '');
    document.getElementById('actions').style.display = 'flex';
    window.__inv = d.invoice.invoice_no || 'invoice';
  } catch (e) {
    console.error(e);
    root.innerHTML = '<div class="state err">Gagal memuat invoice. Periksa koneksi internet lalu muat ulang.</div>';
  }
}

async function savePdf() {
  const btn = document.getElementById('btnPdf');
  const src = document.getElementById('invoice');
  if (!src) return;
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Menyiapkan…';
  // Salin ke ukuran A4 (794px) di luar layar supaya hasil PDF rapi walau dibuka di HP
  const wrap = document.createElement('div');
  wrap.style.cssText = 'position:fixed;left:0;top:0;width:794px;background:#fff;z-index:-1;pointer-events:none';
  const clone = src.cloneNode(true);
  clone.style.width = '794px'; clone.style.margin = '0'; clone.style.boxShadow = 'none'; clone.style.borderRadius = '0';
  wrap.appendChild(clone); document.body.appendChild(wrap);
  try {
    if (typeof html2pdf === 'undefined') throw new Error('html2pdf tidak termuat');
    await html2pdf().set({
      margin: 10,
      filename: (window.__inv || 'invoice') + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, windowWidth: 794, scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).from(clone).save();
  } catch (e) {
    console.error(e);
    window.print(); // cadangan: pilih "Simpan sebagai PDF" di jendela cetak
  } finally {
    wrap.remove(); btn.disabled = false; btn.textContent = old;
  }
}

document.getElementById('btnPrint').addEventListener('click', () => window.print());
document.getElementById('btnPdf').addEventListener('click', savePdf);
load();
</script>
</body>
</html>
