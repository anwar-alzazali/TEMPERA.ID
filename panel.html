<div id="login" hidden>

<span class="logo" style="--w:56px;margin-bottom:12px"></span>
<h1>Panel Admin</h1>
<p>Tempera — masuk dengan akun admin</p>
<form id="loginForm">
<label>Email<input id="lEmail" type="email" autocomplete="username" required></label>
<label>Password<input id="lPass" type="password" autocomplete="current-password" required></label>
<div id="lTs" style="width:100%;min-height:65px;margin:14px 0 4px;overflow:hidden;border-radius:12px"></div>
<button class="btn" id="lBtn" style="width:100%" type="submit">Masuk</button>
<div class="err" id="lErr"></div>
</form>

<radialGradient id="pelek" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></radialGradient>
</defs>
<ellipse cx="112" cy="56" rx="98" ry="3.2" fill="#000" opacity=".45"/>
