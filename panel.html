<style>
:root{--accent:#0891b2;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f1f5f9;--card:#fff;--danger:#dc2626}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:disabled{opacity:.6;cursor:wait}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:10px}
label input,label select,label textarea{margin-top:4px;font-weight:400;color:var(--ink);font-size:14px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
label.chk input{width:auto;margin:0}
.help{font-size:11px;color:var(--muted);margin:-6px 0 10px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginbox{background:var(--card);padding:28px;border-radius:16px;width:100%;max-width:380px;box-shadow:0 8px 32px rgba(15,23,42,.1)}
.loginbox h1{margin:0 0 4px;font-size:22px}
.loginbox p{margin:0 0 18px;color:var(--muted)}

header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}

nav{display:flex;gap:4px;padding:0 12px 10px;overflow-x:auto}
nav button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}

h2{margin:0 0 12px;font-size:18px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.num,th.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover{background:#f8fafc}
.small{font-size:12px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#e2e8f0;color:#334155;white-space:nowrap}
.b-pending{background:#fef3c7;color:#92400e}
.b-paid{background:#dcfce7;color:#166534}
.b-confirmed{background:#dbeafe;color:#1e40af}

.mcard h2{margin-top:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

dl.det dd{margin:0}
.act{border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.row2{display:flex;gap:8px;align-items:end;margin-bottom:10px}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}

@media (max-width:560px){.fgrid{grid-template-columns:1fr}.setrow{grid-template-columns:1fr}dl.det{grid-template-columns:100px 1fr}}

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tglPendek(s) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); return m ? `${m[3]}-${m[2]}-${m[1]}` : (s || '-'); }
function waktu(iso) {

/* ---------- HMAC (sama persis dengan yang dipakai function verifikasi) ---------- */
// Dipakai untuk membuat kode QR referral (opsional, kosmetik) dan kode tetap kartu cetak
// (wajib sama supaya verifikasi.html bisa mengenalinya). token driver_cards dipakai sebagai kunci.
const encHmac = new TextEncoder();
async function hmacHex(key, msg) {
  const k = await crypto.subtle.importKey('raw', encHmac.encode(key), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', k, encHmac.encode(msg));
  return [...new Uint8Array(sig)].map((b) => b.toString(16).padStart(2, '0')).join('');
}

/* ---------- QR referral dengan logo (dibuat langsung di panel) ---------- */
const QR_LOGO_SRC = 'images/logo_sky_blue_transparent.png';
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
async function makeQR(text, size) {
  const q = qrcode(0, 'H');            // level H: tahan logo di tengah
  q.addData(text); q.make();
  const n = q.getModuleCount(), quiet = 4;
  const cell = Math.floor(size / (n + quiet * 2)), total = cell * (n + quiet * 2);
  const c = document.createElement('canvas'); c.width = c.height = total;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, total, total);
  x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) {
    if (q.isDark(r, k)) x.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
  }
  try {
    const img = await loadImg(QR_LOGO_SRC);
    const t = document.createElement('canvas'); t.width = 1328; t.height = 1287;
    const tx = t.getContext('2d');
    tx.drawImage(img, 0, 151, 1328, 1287, 0, 0, 1328, 1287);   // potong bagian kosong atas
    tx.globalCompositeOperation = 'source-in';
    tx.fillStyle = '#0891b2'; tx.fillRect(0, 0, 1328, 1287);    // warnai teal
    const plate = Math.round(total * 0.20), pad = Math.round(plate * 0.06);
    const lw = plate - pad * 2, lh = Math.round(lw * 1287 / 1328);
    const px = Math.round((total - plate) / 2);
    x.fillStyle = '#fff'; x.beginPath();
    if (x.roundRect) x.roundRect(px, px, plate, plate, plate * 0.18); else x.rect(px, px, plate, plate);
    x.fill();
    x.drawImage(t, px + pad, px + Math.round((plate - lh) / 2), lw, lh);
  } catch (_e) { /* logo gagal dimuat: QR tetap valid tanpa logo */ }
  return c;
}
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-qr]');
  if (!b) return;
  const url = b.dataset.qr;
  if (!url) { toast('Alamat situs belum diisi di Pengaturan (site_url)', true); return; }
  if (typeof qrcode !== 'function') { toast('Pustaka QR belum termuat, muat ulang halaman', true); return; }
  const c = await makeQR(url, 720);
  const nama = b.dataset.qrname || 'driver';
  openModal(`
    <h2>QR referral</h2>

    <div class="small" style="word-break:break-all;margin-top:8px">${esc(url)}</div></div>

const S = { drivers: [], siteUrl: '', cards: {} };
const STATUS = { pending: 'Menunggu bayar', dp_paid: 'DP Diterima', paid: 'Lunas', confirmed: 'Dikonfirmasi', completed: 'Selesai', cancelled: 'Dibatalkan', expired: 'Kedaluwarsa' };
const PAID_SET = ['dp_paid', 'paid', 'confirmed', 'completed'];
const WILAYAH = { lembang: 'Lembang', dago: 'Dago', ciwidey: 'Ciwidey', pangalengan: 'Pangalengan' };
const badge = (st) => `<span class="badge b-${esc(st)}">${esc(STATUS[st] || st)}</span>`;
// Pelaksana trip (tampil di daftar pesanan & surat jalan): yang ditugaskan, atau pembawa bila belum ditugaskan.
const drv = (o) => o.assigned_driver || o.driver_slug || '';
// Pemilik pendapatan (dipakai di Laporan): pembawa pesanan (link/QR-nya) lebih diutamakan;
// bila pesanan langsung dari web, pendapatan jatuh ke yang ditugaskan menjalankan trip.
const earner = (o) => o.driver_slug || o.assigned_driver || '';
const driverName = (slug) => { const d = S.drivers.find((x) => x.slug === slug); return d ? d.name : (slug || '-'); };
function destText(o) {
  const d = o.destinations || {};
  const lines = Object.keys(WILAYAH).filter((k) => Array.isArray(d[k]) && d[k].length).map((k) => `${WILAYAH[k]}: ${d[k].join(', ')}`);
  return lines.length ? lines.join('\n') : '-';
}

/* ---------- login ---------- */
function showLogin(msg) {
  $('#shell').hidden = true; $('#login').hidden = false;
  $('#lErr').textContent = msg || '';
}
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#lBtn'); btn.disabled = true; $('#lErr').textContent = '';
  const { error } = await sb.auth.signInWithPassword({ email: $('#lEmail').value.trim(), password: $('#lPass').value });
  btn.disabled = false;
  if (error) { $('#lErr').textContent = 'Email atau password salah.'; return; }
  await enter();
});
$('#btnLogout').addEventListener('click', async () => { await sb.auth.signOut(); showLogin(); });

async function enter() {
  const { data, error } = await sb.rpc('is_admin');
  if (error || data !== true) { await sb.auth.signOut(); showLogin('Akun ini bukan admin.'); return; }
  $('#login').hidden = true; $('#shell').hidden = false;
  await loadShared();
  nav(location.hash.replace('#', '') || 'pesanan');
}
async function loadShared() {
  const d = await sb.from('drivers').select('*').order('driver_code');
  S.drivers = d.data || [];
  const s = await sb.from('app_settings').select('key,value').in('key', ['site_url', 'kas_token']);
  const sm = {}; (s.data || []).forEach((x) => { sm[x.key] = x.value; });
  S.siteUrl = String(sm.site_url || '').replace(/\/+$/, '');
  S.kasToken = sm.kas_token || '';
  const c = await sb.from('driver_cards').select('driver_slug,token');
  S.cards = {};
  (c.data || []).forEach((x) => { S.cards[x.driver_slug] = x.token; });
}

/* ---------- navigasi ---------- */
const VIEWS = {};
const NAVS = [['pesanan', 'Pesanan'], ['laporan', 'Laporan'], ['kas', 'Kas'], ['armada', 'Armada'], ['pengaturan', 'Pengaturan'], ['template', 'Template WA'], ['banner', 'Banner'], ['driver', 'Driver'], ['persetujuan', 'Persetujuan']];
function nav(key) {
  if (!VIEWS[key]) key = 'pesanan';
  location.hash = key;
  $('#nav').innerHTML = NAVS.map(([k, l]) => `<button type="button" data-k="${k}" class="${k === key ? 'on' : ''}">${l}</button>`).join('');
  $$('#nav button').forEach((b) => b.addEventListener('click', () => nav(b.dataset.k)));
  $('#view').innerHTML = '<div class="empty">Memuat…</div>';
  VIEWS[key]();
}

/* ---------- PESANAN ---------- */
let ORDERS = [];
VIEWS.pesanan = async function () {
  $('#view').innerHTML = `
    <h2>Pesanan</h2>
    <div class="bar">
      <select id="fStatus"><option value="">Semua status</option>${Object.keys(STATUS).map((k) => `<option value="${k}">${STATUS[k]}</option>`).join('')}</select>
      <select id="fSumber"><option value="">Semua sumber</option><option value="direct">Langsung dari web</option><option value="driver">Link/QR driver</option></select>
      <input id="fQ" placeholder="Cari nama / order / invoice / WA">
      <button class="btn" id="fGo" type="button">Muat ulang</button>
    </div>
    <div class="card" id="list"></div>`;
  $('#fGo').addEventListener('click', loadOrders);
  $('#fStatus').addEventListener('change', loadOrders);
  $('#fSumber').addEventListener('change', loadOrders);
  $('#fQ').addEventListener('input', renderOrders);
  await loadOrders();
};
async function loadOrders() {
  let q = sb.from('orders').select('*').order('created_at', { ascending: false }).limit(300);
  const st = $('#fStatus').value; if (st) q = q.eq('status', st);
  const so = $('#fSumber').value; if (so) q = q.eq('source', so);
  const { data, error } = await q;
  if (error) { toast(error.message, true); $('#list').innerHTML = `<div class="empty">Gagal memuat: ${esc(error.message)}</div>`; return; }
  ORDERS = data || [];
  renderOrders();
}
function renderOrders() {
  const q = ($('#fQ').value || '').toLowerCase().trim();
  const rows = ORDERS.filter((o) => !q || [o.customer_name, o.order_id, o.invoice_no, o.customer_wa, o.fleet_name].join(' ').toLowerCase().includes(q));
  if (!rows.length) { $('#list').innerHTML = '<div class="empty">Belum ada pesanan.</div>'; return; }
  $('#list').innerHTML = `<div class="tablewrap"><table>
    <thead><tr><th>Dibuat</th><th>Pesanan</th><th>Pelanggan</th><th>Trip</th><th class="num">Total</th><th>Status</th><th>Driver</th></tr></thead>
    <tbody>${rows.map((o) => `<tr class="click" data-id="${esc(o.id)}">
      <td class="small">${esc(waktu(o.created_at))}</td>
      <td><b>${esc(o.invoice_no || '—')}</b><div class="small">${esc(o.order_id)}</div></td>
      <td>${esc(o.customer_name)}<div class="small">${esc(o.customer_wa)}</div></td>
      <td>${esc(tglPendek(o.trip_date))} ${esc(o.trip_time || '')}<div class="small">${esc(o.fleet_name || '')}</div></td>
      <td class="num">${rp(o.total)}</td>
      <td>${badge(o.status)}<div class="small">${o.source === 'driver' ? 'Link driver' : 'Langsung'}</div></td>
      <td>${esc(driverName(drv(o)))}</td></tr>`).join('')}</tbody></table></div>`;
  $$('#list tr.click').forEach((tr) => tr.addEventListener('click', () => openOrder(tr.dataset.id)));
}
function driverMsg(o, d, sjLink) {
  const dpInfo = o.payment_mode === 'dp'
    ? `\n\n💰 Pesanan ini DP (baru bayar ${rp(o.dp_amount)}).\nTagih TUNAI ke pelanggan: ${rp(Math.max(0, Number(o.total) - Number(o.dp_amount || 0)))}\nSisa akan ditransfer admin: ${rp(Math.max(0, Number(o.dp_amount || 0) - Number(o.admin_cut_amount || 0)))}`
    : '';
  return `Halo ${d.name}, ada trip untukmu.\n\nOrder: ${o.order_id}\nPelanggan: ${o.customer_name} (${o.customer_wa})\nArmada: ${o.fleet_name || '-'}\nTanggal: ${tglPendek(o.trip_date)}, jam ${o.trip_time || '-'}\nPeserta: ${o.pax || '-'} orang\nTitik jemput: ${o.pickup_note || '-'}\n\nDestinasi:\n${destText(o)}\n\nPendapatanmu: ${rp(o.driver_earning)}${dpInfo}${sjLink ? `\n\nSurat jalan: ${sjLink}` : ''}`;
}
async function openOrder(id) {
  const o = ORDERS.find((x) => x.id === id); if (!o) return;
  const cur = drv(o);
  const stOpts = Object.keys(STATUS).map((k) => `<option value="${k}" ${k === o.status ? 'selected' : ''}>${STATUS[k]}</option>`).join('');
  const drOpts = '<option value="">— belum ditentukan —</option>' + S.drivers.filter((d) => d.is_active !== false || d.slug === cur)
    .map((d) => `<option value="${esc(d.slug)}" ${d.slug === cur ? 'selected' : ''}>${esc(d.name)} (${esc(d.slug)})</option>`).join('');
  const invLink = (S.siteUrl && o.invoice_token && PAID_SET.includes(o.status)) ? `${S.siteUrl}/invoice.html?t=${o.invoice_token}` : '';
  const sjLink = (S.siteUrl && o.sj_no && o.sj_token) ? `${S.siteUrl}/surat-jalan.html?t=${o.sj_token}` : '';
  const dObj = S.drivers.find((d) => d.slug === cur);
  const waDriver = (dObj && dObj.phone) ? `https://wa.me/${normWA(dObj.phone)}?text=${encodeURIComponent(driverMsg(o, dObj, sjLink))}` : '';

  // cek apakah data pesanan sudah berbeda dari surat jalan yang terbit (perlu revisi)
  let sjChanged = false;
  if (o.sj_no) {
    const r = await sb.rpc('sj_changed', { p_order: o.id });
    sjChanged = r.data === true;
  }
  const sjInfo = o.sj_no
    ? `${esc(o.sj_no)} · Rev ${esc(o.sj_rev)}${sjChanged ? ' <span class="badge b-pending">Data berubah, perlu revisi</span>' : ''}`
    : '<span class="small">Belum terbit — perlu status DP Diterima/Lunas &amp; driver bertugas</span>';

  openModal(`
    <h2>${esc(o.invoice_no || o.order_id)} ${badge(o.status)}</h2>
    <dl class="det">
      <dt>Order</dt><dd>${esc(o.order_id)}</dd>
      <dt>Pelanggan</dt><dd>${esc(o.customer_name)} · <a href="https://wa.me/${esc(normWA(o.customer_wa))}" target="_blank" rel="noopener">${esc(o.customer_wa)}</a></dd>
      <dt>Armada</dt><dd>${esc(o.fleet_name || '-')}</dd>
      <dt>Jadwal</dt><dd>${esc(tglPendek(o.trip_date))}, jam ${esc(o.trip_time || '-')} · ${esc(o.pax || '-')} peserta</dd>
      <dt>Titik jemput</dt><dd>${esc(o.pickup_note || '-')}</dd>
      <dt>Destinasi</dt><dd style="white-space:pre-line">${esc(destText(o))}</dd>
      <dt>Biaya</dt><dd>Armada ${rp(o.base_price)}${Number(o.cross_cost) > 0 ? ` + lintas ${rp(o.cross_cost)}` : ''}${Number(o.discount) > 0 ? ` − diskon ${rp(o.discount)}` : ''} = <b>${rp(o.total)}</b></dd>
      ${o.payment_mode === 'dp' ? `<dt>DP</dt><dd>Diterima ${rp(o.dp_amount)}${o.dp_percent_applied ? ` (${o.dp_percent_applied}%)` : ''} lewat Midtrans.<br>
        Tunai ditagih ke pelanggan: <b>${rp(Math.max(0, Number(o.total) - Number(o.dp_amount || 0)))}</b><br>
        Sisa transfer admin ke driver dari DP: <b>${rp(Math.max(0, Number(o.dp_amount || 0) - Number(o.admin_cut_amount || 0)))}</b></dd>` : ''}
      <dt>Potongan admin</dt><dd>${rp(o.admin_cut_amount)} (${esc(o.admin_cut_value)}${o.admin_cut_type === 'flat' ? ' Rp' : '%'})</dd>
      <dt>Pendapatan driver</dt><dd>${rp(o.driver_earning)}</dd>
      <dt>Sumber</dt><dd>${o.source === 'driver' ? 'Link/QR driver: ' + esc(driverName(o.driver_slug)) : 'Langsung dari web'}</dd>
      <dt>Pembayaran</dt><dd>${esc(o.midtrans_status || '-')} · ${esc(o.payment_type || '-')} · ${esc(waktu(o.paid_at))}</dd>
      <dt>Invoice dikirim</dt><dd>${esc(waktu(o.invoice_sent_at))}</dd>
      <dt>Surat jalan</dt><dd>${sjInfo}</dd>
    </dl>
    <div class="act">
      <div class="row2"><label>Status<select id="oStatus">${stOpts}</select></label><button class="btn" id="oSaveStatus" type="button">Simpan status</button></div>
      <div class="row2"><label>Driver bertugas<select id="oDriver">${drOpts}</select></label><button class="btn" id="oSaveDriver" type="button">Simpan driver</button></div>
      <div class="mbtns" style="justify-content:flex-start">
        ${invLink ? `<button class="btn ghost sm" type="button" data-copy="${esc(invLink)}">Salin link invoice</button><a class="btn ghost sm" href="${esc(invLink)}" target="_blank" rel="noopener" style="text-decoration:none">Buka invoice</a>` : ''}
        ${sjLink ? `<button class="btn ghost sm" type="button" data-copy="${esc(sjLink)}">Salin link surat</button><a class="btn ghost sm" href="${esc(sjLink)}" target="_blank" rel="noopener" style="text-decoration:none">Buka surat jalan</a>` : ''}
        ${sjChanged ? `<button class="btn sm" type="button" id="oRevisi">Terbitkan revisi</button>` : ''}
        ${waDriver ? `<a class="btn ghost sm" href="${esc(waDriver)}" target="_blank" rel="noopener" style="text-decoration:none">Kirim detail ke driver (WA)</a>` : ''}
        <button class="btn ghost sm" type="button" id="oClose">Tutup</button>
      </div>
    </div>`);
  $('#oClose').addEventListener('click', closeModal);
  $('#oSaveStatus').addEventListener('click', async () => {
    const st = $('#oStatus').value;
    if (st === o.status) { toast('Status tidak berubah'); return; }
    if ((st === 'cancelled' || st === 'expired') && PAID_SET.includes(o.status) &&
        !confirm('Pesanan ini sudah LUNAS. Mengubahnya menjadi batal TIDAK mengembalikan uang pelanggan (lakukan refund manual di dashboard Midtrans). Lanjutkan?')) return;
    const r = await sb.from('orders').update({ status: st }).eq('id', o.id);
    if (r.error) { toast(r.error.message, true); return; }
    toast('Status disimpan'); closeModal(); loadOrders();
  });
  $('#oSaveDriver').addEventListener('click', async () => {
    const v = $('#oDriver').value || null;
    const r = await sb.from('orders').update({ assigned_driver: v }).eq('id', o.id);
    if (r.error) { toast(r.error.message, true); return; }
    toast('Driver disimpan'); closeModal(); loadOrders();
  });
  if ($('#oRevisi')) $('#oRevisi').addEventListener('click', async () => {
    if (!confirm(`Terbitkan revisi baru surat jalan ${o.sj_no} dengan data pesanan saat ini? Revisi sebelumnya tidak berlaku lagi.`)) return;
    const r = await sb.rpc('issue_sj_revision', { p_order: o.id });
    if (r.error) { toast(r.error.message, true); return; }
    o.sj_rev = r.data.sj_rev;
    toast('Revisi diterbitkan. Link surat tidak berubah — cukup kirim ke driver bila ia belum pernah menerimanya.');
    loadOrders();       // sinkron daftar di belakang layar
    openOrder(o.id);    // buka ulang jendela yang sama, dengan tombol WA siap ditekan
  });
}

VIEWS.laporan = async function () {
  $('#view').innerHTML = `
    <h2>Laporan</h2>
    <div class="bar"><select id="rPer">
      <option value="7">7 hari terakhir</option><option value="30" selected>30 hari terakhir</option>

    <div id="rOut"><div class="empty">Memuat…</div></div>`;

async function loadLaporan() {
  const per = $('#rPer').value;
  let q = sb.from('orders').select('*').in('status', PAID_SET).limit(3000);
  const now = new Date();
  if (per === '7' || per === '30') q = q.gte('paid_at', new Date(now.getTime() - Number(per) * 86400000).toISOString());
  if (per === 'bulan') q = q.gte('paid_at', new Date(now.getFullYear(), now.getMonth(), 1).toISOString());
  const [o, f] = await Promise.all([q, sb.from('v_funnel').select('*')]);
  if (o.error) { $('#rOut').innerHTML = `<div class="empty">Gagal memuat: ${esc(o.error.message)}</div>`; return; }
  const rows = o.data || [];
  const sum = (arr, k) => arr.reduce((a, x) => a + (Number(x[k]) || 0), 0);
  const byDrv = {};
  rows.forEach((x) => { const k = earner(x) || '(belum ditentukan)'; (byDrv[k] = byDrv[k] || []).push(x); });
  const drvRows = Object.keys(byDrv).map((k) => `<tr><td>${esc(k === '(belum ditentukan)' ? k : driverName(k))}</td><td class="num">${byDrv[k].length}</td><td class="num">${rp(sum(byDrv[k], 'total'))}</td><td class="num">${rp(sum(byDrv[k], 'driver_earning'))}</td></tr>`).join('');
  const fun = (f.data || []).map((x) => `<tr><td>${esc(x.sumber === 'direct' ? 'Langsung dari web' : driverName(x.sumber))}</td><td class="num">${x.visit}</td><td class="num">${x.scan}</td><td class="num">${x.order_dibuat}</td><td class="num">${x.closing}</td><td class="num">${rp(x.omzet)}</td></tr>`).join('');
  $('#rOut').innerHTML = `
    <div class="stats">
      <div class="stat"><div class="v">${rows.length}</div><div class="l">Pesanan lunas</div></div>
      <div class="stat"><div class="v">${rp(sum(rows, 'total'))}</div><div class="l">Omzet</div></div>
      <div class="stat"><div class="v">${rp(sum(rows, 'admin_cut_amount'))}</div><div class="l">Potongan admin</div></div>
      <div class="stat"><div class="v">${rp(sum(rows, 'driver_earning'))}</div><div class="l">Pendapatan driver</div></div>
    </div>
    <div class="card" style="margin-bottom:14px"><h2>Per pembawa pesanan</h2><div class="tablewrap"><table>
      <thead><tr><th>Pembawa pesanan</th><th class="num">Trip</th><th class="num">Omzet</th><th class="num">Pendapatan</th></tr></thead>
      <tbody>${drvRows || '<tr><td colspan="4" class="empty">Belum ada data.</td></tr>'}</tbody></table></div>
      <div class="help" style="margin-top:8px">Pendapatan dicatat untuk yang membawa pesanan (pemilik link/QR). Bila driver itu melemparkan trip ke orang lain, pendapatan tetap di sini &mdash; pembagian dengan pelaksana adalah urusan mereka sendiri.</div></div>
    <div class="card"><h2>Kunjungan → closing (semua waktu)</h2><div class="tablewrap"><table>
      <thead><tr><th>Sumber</th><th class="num">Visit</th><th class="num">Scan</th><th class="num">Order dibuat</th><th class="num">Closing</th><th class="num">Omzet</th></tr></thead>
      <tbody>${fun || '<tr><td colspan="6" class="empty">Belum ada data.</td></tr>'}</tbody></table></div>
      <div class="help" style="margin-top:8px">Visit = hanya berkunjung. Scan = lewat link/QR driver. Closing = pesanan yang sudah dibayar.</div></div>`;
}

const KAS_JENIS = { setoran_driver: 'Setoran driver', komisi_admin: 'Komisi admin (otomatis)', pengeluaran: 'Pengeluaran', lainnya: 'Lainnya' };
let KAS_ROWS = [];
VIEWS.kas = async function () {
  const { data, error } = await sb.from('kas_transaksi').select('*').order('tanggal', { ascending: true }).order('created_at', { ascending: true });
  if (error) { $('#view').innerHTML = `<div class="empty">Gagal memuat: ${esc(error.message)}</div>`; return; }
  let saldo = 0;
  KAS_ROWS = (data || []).map((r) => { saldo += Number(r.jumlah); return { ...r, saldoSaat: saldo }; }).reverse();
  const totalMasuk = (data || []).filter((r) => r.jumlah > 0).reduce((a, r) => a + Number(r.jumlah), 0);
  const totalKeluar = (data || []).filter((r) => r.jumlah < 0).reduce((a, r) => a + Number(r.jumlah), 0);

  const kasLink = (S.siteUrl && S.kasToken) ? `${S.siteUrl}/kas.html?t=${S.kasToken}` : '';

  $('#view').innerHTML = `
    <div class="bar" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Kas</h2><button class="btn" id="btnKasNew" type="button">+ Tambah</button></div>
    <div class="stats">
      <div class="stat"><div class="v">${rp(saldo)}</div><div class="l">Saldo kas saat ini</div></div>
      <div class="stat"><div class="v">${rp(totalMasuk)}</div><div class="l">Total masuk</div></div>
      <div class="stat"><div class="v">${rp(Math.abs(totalKeluar))}</div><div class="l">Total keluar</div></div>
      <div class="stat"><div class="v">${KAS_ROWS.length}</div><div class="l">Jumlah transaksi</div></div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <h2>Link kas untuk anggota</h2>
      <div class="mbtns" style="justify-content:flex-start">
        ${kasLink ? `<button class="btn ghost sm" type="button" data-copy="${esc(kasLink)}">Salin link</button><a class="btn ghost sm" href="${esc(kasLink)}" target="_blank" rel="noopener" style="text-decoration:none">Buka</a>` : '<span class="small">Alamat situs belum diisi di Pengaturan (site_url)</span>'}
        <button class="btn ghost sm" type="button" id="btnKasRotate">Ganti token</button>
      </div>
      <div class="help" style="margin-top:8px">Satu link sama untuk semua anggota &mdash; semua orang melihat pembukuan yang sama persis. Ganti token akan langsung mematikan link lama.</div>
    </div>
    <div class="card"><div class="tablewrap"><table>
      <thead><tr><th>Tanggal</th><th>Jenis</th><th>Keterangan</th><th class="num">Jumlah</th><th class="num">Saldo</th></tr></thead>
      <tbody>${KAS_ROWS.map((r, i) => `<tr>
        <td class="small">${esc(tglPendek(r.tanggal))}</td>
        <td>${esc(KAS_JENIS[r.jenis] || r.jenis)}${r.driver_slug ? `<div class="small">${esc(driverName(r.driver_slug))}</div>` : ''}</td>
        <td>${esc(r.keterangan || '-')}</td>
        <td class="num" style="color:${r.jumlah < 0 ? 'var(--danger)' : '#166534'}">${r.jumlah < 0 ? '- ' : '+ '}${rp(Math.abs(r.jumlah))}</td>
        <td class="num">${rp(r.saldoSaat)}</td>
      </tr>`).join('') || `<tr><td colspan="5" class="empty">Belum ada transaksi.</td></tr>`}</tbody>
    </table></div></div>`;

  $('#btnKasNew').addEventListener('click', openKasForm);
  $('#btnKasRotate').addEventListener('click', async () => {
    if (!confirm('Ganti token link kas? Link lama akan langsung berhenti berfungsi, jadi anggota perlu link barunya.')) return;
    const r = await sb.rpc('rotate_kas_token');
    if (r.error) { toast(r.error.message, true); return; }
    S.kasToken = r.data;
    toast('Token diganti. Bagikan link kas yang baru ke anggota.');
    nav('kas');
  });
};

function openKasForm() {
  const drOpts = S.drivers.map((d) => `<option value="${esc(d.slug)}">${esc(d.name)}</option>`).join('');
  const today = new Date().toISOString().slice(0, 10);
  openModal(`
    <h2>Tambah transaksi kas</h2>
    <div class="fgrid">
      <div><label>Jenis<select id="kJenis">
        <option value="setoran_driver">Setoran driver (masuk)</option>
        <option value="pengeluaran">Pengeluaran (keluar)</option>
        <option value="lainnya">Lainnya (masuk)</option>
      </select></label></div>
      <div><label>Tanggal<input id="kTanggal" type="date" value="${today}"></label></div>
      <div id="kDriverWrap"><label>Driver<select id="kDriver">${drOpts}</select></label></div>
      <div><label>Jumlah (Rp)<input id="kJumlah" type="number" step="any" placeholder="mis. 50000"></label></div>
      <div class="full"><label>Keterangan<input id="kKet" type="text" placeholder="mis. Setoran kas bulan Oktober"></label></div>
    </div>
    <div class="mbtns">
      <button class="btn ghost" id="kCancel" type="button">Batal</button>
      <button class="btn" id="kSave" type="button">Simpan</button>
    </div>`);
  const jenisSel = $('#kJenis');
  const toggleDriver = () => { $('#kDriverWrap').style.display = jenisSel.value === 'setoran_driver' ? '' : 'none'; };
  jenisSel.addEventListener('change', toggleDriver); toggleDriver();
  $('#kCancel').addEventListener('click', closeModal);
  $('#kSave').addEventListener('click', async () => {
    const jenis = jenisSel.value;
    const tanggal = $('#kTanggal').value || today;
    let jumlah = Number($('#kJumlah').value);
    const keterangan = $('#kKet').value.trim();
    const driver_slug = jenis === 'setoran_driver' ? ($('#kDriver').value || null) : null;
    if (!jumlah || jumlah <= 0) { toast('Jumlah harus lebih dari 0', true); return; }
    if (jenis === 'setoran_driver' && !driver_slug) { toast('Pilih drivernya', true); return; }
    if (jenis === 'pengeluaran') jumlah = -Math.abs(jumlah);
    const r = await sb.from('kas_transaksi').insert({ jenis, tanggal, jumlah, keterangan: keterangan || null, driver_slug });
    if (r.error) { toast(r.error.message, true); return; }
    toast('Tersimpan'); closeModal(); nav('kas');
  });
}

let ROWS = {};

function fieldHTML(f, val, disabled) {
  const id = 'f_' + f.key, cls = f.full ? ' class="full"' : '';
  if (f.type === 'photo') {
    const prev = val ? `<img src="${esc(val)}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;display:block;margin-bottom:8px">` : '';
    return `<div${cls}><label>${esc(f.label)}</label>
      <div id="${id}_prev">${prev}</div>
      <input type="file" id="${id}_file" accept="image/*">
      <input type="hidden" id="${id}" value="${esc(val || '')}">
      <div class="help" id="${id}_status">&nbsp;</div></div>`;
  }
  if (f.type === 'bool') return `<div${cls}><label class="chk"><input type="checkbox" id="${id}" ${val ? 'checked' : ''}> ${esc(f.label)}</label></div>`;
  if (f.type === 'textarea') return `<div${cls}><label>${esc(f.label)}<textarea id="${id}" rows="${f.rows || 4}">${esc(val == null ? '' : val)}</textarea></label></div>`;
  const type = f.type === 'number' ? 'number' : (f.type === 'datetime' ? 'datetime-local' : 'text');
  const v = f.type === 'array' ? (Array.isArray(val) ? val.join(', ') : '') : (f.type === 'datetime' ? isoToLocal(val) : (val == null ? '' : val));
  return `<div${cls}><label>${esc(f.label)}${f.required ? ' *' : ''}<input id="${id}" type="${type}" value="${esc(v)}" ${f.type === 'number' ? 'step="any"' : ''} ${disabled ? 'disabled' : ''}></label>${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}</div>`;
}
function readField(f, required) {
  const el = $('#f_' + f.key);
  if (f.type === 'bool') return el.checked;
  const v = el.value.trim();
  if (f.type === 'number') return v === '' ? (required ? null : 0) : Number(v);
  if (f.type === 'array') return v ? v.split(',').map((x) => x.trim()).filter(Boolean) : [];
  if (f.type === 'datetime') return v ? new Date(v).toISOString() : null;
  return v === '' ? null : v;
}
function openForm(key, row) {
  const R = RES[key], isNew = !row;
  const src = row || R.defaults || {};
  openModal(`
    <h2>${isNew ? 'Tambah' : 'Ubah'} ${esc(R.title)}</h2>
    ${R.note || ''}
    <div class="fgrid">${R.fields.map((f) => fieldHTML(f, src[f.key], f.createOnly && !isNew)).join('')}</div>
    <div class="mbtns">
      ${(!isNew && R.canDelete) ? '<button class="btn danger" id="mDel" type="button">Hapus</button>' : ''}
      <button class="btn ghost" id="mCancel" type="button">Batal</button>
      <button class="btn" id="mSave" type="button">Simpan</button>
    </div>`);
  if (key === 'driver' && isNew) {
    const nameEl = $('#f_name'), slugEl = $('#f_slug');
    let slugTouched = false;
    slugEl.addEventListener('input', () => { slugTouched = true; });
    nameEl.addEventListener('input', () => {
      if (slugTouched) return;
      slugEl.value = nameEl.value.toLowerCase().trim()
        .replace(/[^a-z0-9\s-]/g, '').replace(/\s+/g, '-').replace(/-+/g, '-');
    });
  }
  const photoField = R.fields.find((f) => f.type === 'photo');
  if (photoField) {
    const pid = 'f_' + photoField.key;
    const fileEl = $('#' + pid + '_file'), hiddenEl = $('#' + pid), statusEl = $('#' + pid + '_status');
    fileEl.addEventListener('change', async () => {
      const file = fileEl.files[0]; if (!file) return;
      statusEl.textContent = 'Mengunggah…';
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const up = await sb.storage.from('driver-photos').upload(path, file, { upsert: false });
      if (up.error) { statusEl.textContent = 'Gagal unggah: ' + up.error.message; return; }
      const pub = sb.storage.from('driver-photos').getPublicUrl(path).data.publicUrl;
      hiddenEl.value = pub;
      $('#' + pid + '_prev').innerHTML = `<img src="${esc(pub)}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;display:block;margin-bottom:8px">`;
      statusEl.textContent = 'Terunggah';
    });
  }
  $('#mCancel').addEventListener('click', closeModal);
  $('#mSave').addEventListener('click', () => saveForm(key, row));
  if ($('#mDel')) $('#mDel').addEventListener('click', async () => {
    if (!confirm('Hapus data ini?')) return;
    const r = await sb.from(R.table).delete().eq(R.pk, row[R.pk]);
    if (r.error) { toast(r.error.message, true); return; }
    toast('Dihapus'); closeModal(); nav(key);
  });
}
async function saveForm(key, row) {
  const R = RES[key], isNew = !row, payload = {};
  for (const f of R.fields) {
    if (f.createOnly && !isNew) continue;
    const v = readField(f, f.required);
    if (f.required && (v === null || v === '' || (Array.isArray(v) && !v.length))) { toast(`${f.label} wajib diisi`, true); return; }
    payload[f.key] = v;
  }
  if (R.stamp) payload.updated_at = new Date().toISOString();
  const btn = $('#mSave'); btn.disabled = true;
  const res = isNew ? await sb.from(R.table).insert(payload) : await sb.from(R.table).update(payload).eq(R.pk, row[R.pk]);
  btn.disabled = false;
  if (res.error) { toast(res.error.message, true); return; }
  toast('Tersimpan'); closeModal();
  if (key === 'driver') await loadShared();
  nav(key);
}

async function dataRekap() {

  const per = {};
  r.data.forEach((x) => {
    const b = String(x.bulan).slice(0, 7);
    const a = (per[x.driver_slug] ||= { slug: x.driver_slug, nama: x.nama, kode: x.kode, bulan: {}, tunggakan: 0, dimuka: 0 });

async function muatTarif() {
  const r = await sb.from('iuran_tarif').select('*').order('berlaku_mulai', { ascending: false });
  $('#trIsi').innerHTML = r.error ? `<div class="empty">${esc(r.error.message)}</div>` : `<div class="tablewrap"><table style="min-width:280px"><thead><tr><th>Berlaku mulai</th><th class="num">Per bulan</th><th></th></tr></thead><tbody>
    ${(r.data || []).map((t) => `<tr><td>${esc(blnL(t.berlaku_mulai))}</td><td class="num">${rp(t.nominal)}</td><td class="num">${(r.data.length > 1) ? `<button class="btn ghost sm" type="button" data-tr-hapus="${esc(t.berlaku_mulai)}">Hapus</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
}
async function dataKhusus() {
  const [i, p, b] = await Promise.all([sb.from('iuran_khusus').select('*').order('id', { ascending: false }), sb.from('iuran_khusus_peserta').select('*'), sb.from('iuran_khusus_bayar').select('*').order('created_at')]);
  if (i.error || p.error || b.error) throw new Error((i.error || p.error || b.error).message);
  return (i.data || []).map((x) => {
    const peserta = p.data.filter((q) => q.iuran_id === x.id).map((q) => {
      const bayar = b.data.filter((y) => y.iuran_id === x.id && y.driver_slug === q.driver_slug);
      const terbayar = bayar.reduce((s, y) => s + y.jumlah, 0);
      return { ...q, nama: driverName(q.driver_slug), terbayar, sisa: Math.max(0, q.nominal - terbayar), bayar };
    }).sort((a, c) => (a.sisa > 0 ? 0 : 1) - (c.sisa > 0 ? 0 : 1) || String(a.nama).localeCompare(String(c.nama)));
    return { ...x, peserta, target: peserta.reduce((s, q) => s + q.nominal, 0), terkumpul: peserta.reduce((s, q) => s + Math.min(q.terbayar, q.nominal), 0),
             masuk: b.data.filter((y) => y.iuran_id === x.id).reduce((s, y) => s + y.jumlah, 0) };
  });
}
function htmlKhusus(x) {
  return `<div class="tablewrap"><table style="min-width:360px"><thead><tr><th>Anggota</th><th class="num">Iuran</th><th class="num">Dibayar</th><th class="num">Sisa</th></tr></thead><tbody>
    ${x.peserta.map((q) => `<tr><td>${esc(q.nama)}</td><td class="num">${rp(q.nominal)}</td><td class="num">${rp(Math.min(q.terbayar, q.nominal))}</td><td class="num" style="${q.sisa > 0 ? 'color:#b91c1c;font-weight:700' : ''}">${q.sisa > 0 ? rp(q.sisa) : '✅'}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td class="num"><b>${rp(x.target)}</b></td><td class="num"><b>${rp(x.terkumpul)}</b></td><td class="num"><b>${rp(x.target - x.terkumpul)}</b></td></tr></tbody></table></div>`;
}
let IK = [];
async function muatIuranKhusus() {
  try { IK = await dataKhusus(); } catch (e) { $('#ikList').innerHTML = `<div class="empty">Gagal memuat: ${esc(e.message)}</div>`; return; }
  $('#ikList').innerHTML = IK.length ? IK.map((x, i) => `<div style="border-top:1px solid var(--line);padding:10px 0">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><div><b>${esc(x.judul)}</b> ${x.status === 'selesai' ? '<span class="badge b-cancelled">Ditutup</span>' : '<span class="badge b-paid">Aktif</span>'}
        <div class="small">${x.batas ? `Batas ${esc(tglPendek(x.batas))} · ` : ''}Terkumpul ${rp(x.terkumpul)} dari ${rp(x.target)} · ${x.peserta.filter((q) => q.sisa > 0).length} belum lunas${x.masuk > x.terkumpul ? ` · lebih bayar ${rp(x.masuk - x.terkumpul)}` : ''}</div></div>
        <div class="mbtns" style="margin:0"><button class="btn ghost sm" type="button" data-ik-cetak="${i}">Cetak</button><button class="btn sm" type="button" data-ik-kelola="${i}">Kelola</button></div></div></div>`).join('')
    : '<div class="empty">Belum ada iuran khusus.</div>';
}
function kelolaIuran(x) {
  const bukan = S.drivers.filter((d) => d.is_active !== false && !x.peserta.some((q) => q.driver_slug === d.slug));
  openModal(`<h2>${esc(x.judul)}</h2>
    <div class="fgrid"><div><label>Judul<input id="mkJudul" maxlength="80" value="${esc(x.judul)}"></label></div>
      <div><label>Batas bayar<input id="mkBatas" type="date" value="${esc(x.batas || '')}"></label></div>
      <div class="full"><label>Keterangan<input id="mkKet" value="${esc(x.keterangan || '')}"></label></div></div>
    <div class="mbtns" style="justify-content:flex-start"><button class="btn sm" type="button" id="mkSimpan">Simpan judul/keterangan</button>
      <button class="btn ghost sm" type="button" id="mkStatus">${x.status === 'aktif' ? 'Tutup iuran' : 'Aktifkan lagi'}</button></div>
    <h2 style="margin-top:14px">Peserta</h2>
    <div class="tablewrap"><table style="min-width:520px"><thead><tr><th>Anggota</th><th>Nominal</th><th class="num">Dibayar</th><th>Catat bayar manual</th><th></th></tr></thead><tbody>
      ${x.peserta.map((q) => `<tr><td>${esc(q.nama)}${q.sisa > 0 ? '' : ' ✅'}</td>
        <td><div style="display:flex;gap:4px"><input type="number" min="0" step="1000" value="${esc(q.nominal)}" data-mk-nom="${esc(q.driver_slug)}" style="width:100px"><button class="btn ghost sm" type="button" data-mk-nomsave="${esc(q.driver_slug)}">OK</button></div></td>
        <td class="num">${rp(q.terbayar)}${q.bayar.length ? `<div class="small">${q.bayar.map((y) => `${esc(tglPendek(y.tanggal))} ${rp(y.jumlah)}${y.kas_pending_id ? ' (QRIS)' : ` <a href="#" data-mk-hapusbayar="${esc(y.id)}">hapus</a>`}`).join('<br>')}</div>` : ''}</td>
        <td>${q.sisa > 0 ? `<div style="display:flex;gap:4px"><input type="number" min="1" step="1000" placeholder="${esc(q.sisa)}" data-mk-bayar="${esc(q.driver_slug)}" style="width:100px"><button class="btn sm" type="button" data-mk-bayarsave="${esc(q.driver_slug)}">Catat</button></div>` : ''}</td>
        <td class="num">${q.terbayar ? '' : `<button class="btn ghost sm" type="button" data-mk-keluar="${esc(q.driver_slug)}">Keluarkan</button>`}</td></tr>`).join('')}
    </tbody></table></div>
    ${bukan.length ? `<div class="row2" style="margin-top:10px"><label>Tambah peserta<select id="mkTambah">${bukan.map((d) => `<option value="${esc(d.slug)}">${esc(d.name)} (${esc(d.driver_code || d.slug)})</option>`).join('')}</select></label><button class="btn ghost" type="button" id="mkTambahBtn">Tambah</button></div>` : ''}
    <div class="help">"Catat bayar manual" untuk yang membayar tunai/transfer langsung ke admin. Pembayaran lewat QRIS tercatat otomatis.</div>
    <div class="mbtns"><button class="btn ghost" type="button" id="mkTutup">Tutup</button></div>`);
  const ulang = async () => { await muatIuranKhusus(); const baru = IK.find((y) => y.id === x.id); if (baru) kelolaIuran(baru); else closeModal(); };
  const jalan = async (p, pesanOk) => { const r = await p; if (r.error) { toast(r.error.message, true); return; } toast(pesanOk); ulang(); };
  $('#mkTutup').addEventListener('click', closeModal);
  $('#mkSimpan').addEventListener('click', () => { const j = $('#mkJudul').value.trim(); if (!j) { toast('Judul wajib', true); return; }
    jalan(sb.from('iuran_khusus').update({ judul: j, keterangan: $('#mkKet').value.trim() || null, batas: $('#mkBatas').value || null }).eq('id', x.id), 'Disimpan'); });
  $('#mkStatus').addEventListener('click', () => jalan(sb.from('iuran_khusus').update({ status: x.status === 'aktif' ? 'selesai' : 'aktif' }).eq('id', x.id), x.status === 'aktif' ? 'Iuran ditutup' : 'Iuran diaktifkan'));
  if ($('#mkTambahBtn')) $('#mkTambahBtn').addEventListener('click', () => jalan(sb.from('iuran_khusus_peserta').insert({ iuran_id: x.id, driver_slug: $('#mkTambah').value, nominal: x.nominal_default }), 'Peserta ditambahkan'));
  $$('#modalBody [data-mk-nomsave]').forEach((b) => b.addEventListener('click', () => { const s = b.dataset.mkNomsave; const n = parseInt($(`#modalBody [data-mk-nom="${CSS.escape(s)}"]`).value, 10);
    if (!(n >= 0)) { toast('Nominal tidak valid', true); return; } jalan(sb.from('iuran_khusus_peserta').update({ nominal: n }).eq('iuran_id', x.id).eq('driver_slug', s), 'Nominal diubah'); }));
  $$('#modalBody [data-mk-bayarsave]').forEach((b) => b.addEventListener('click', () => { const s = b.dataset.mkBayarsave; const el = $(`#modalBody [data-mk-bayar="${CSS.escape(s)}"]`);
    const n = parseInt(el.value || el.placeholder, 10); if (!(n > 0)) { toast('Isi jumlah', true); return; }
    jalan(sb.from('iuran_khusus_bayar').insert({ iuran_id: x.id, driver_slug: s, jumlah: n, keterangan: 'Dicatat admin (tunai/transfer)', dicatat_oleh: 'admin' }), 'Pembayaran dicatat'); }));
  $$('#modalBody [data-mk-keluar]').forEach((b) => b.addEventListener('click', () => { if (!confirm('Keluarkan anggota ini dari iuran?')) return;
    jalan(sb.from('iuran_khusus_peserta').delete().eq('iuran_id', x.id).eq('driver_slug', b.dataset.mkKeluar), 'Peserta dikeluarkan'); }));
  $$('#modalBody [data-mk-hapusbayar]').forEach((a) => a.addEventListener('click', (e) => { e.preventDefault(); if (!confirm('Hapus catatan pembayaran manual ini?')) return;
    jalan(sb.from('iuran_khusus_bayar').delete().eq('id', a.dataset.mkHapusbayar), 'Catatan dihapus'); }));
}
document.addEventListener('click', (e) => {
  const k = e.target.closest('[data-ik-kelola]'); if (k) { kelolaIuran(IK[+k.dataset.ikKelola]); return; }
  const c = e.target.closest('[data-ik-cetak]'); if (c) { const x = IK[+c.dataset.ikCetak]; cetakKas(`Iuran: ${x.judul}`, `${x.batas ? 'Batas ' + tglPendek(x.batas) + ' · ' : ''}Terkumpul ${rp(x.terkumpul)} dari ${rp(x.target)}`, htmlKhusus(x)); return; }
  const h = e.target.closest('[data-tr-hapus]'); if (h) { if (!confirm('Hapus tarif ini?')) return;
    sb.from('iuran_tarif').delete().eq('berlaku_mulai', h.dataset.trHapus).then((r) => { if (r.error) toast(r.error.message, true); else { toast('Tarif dihapus'); nav('kas'); } }); }
});

</script>
</body>
