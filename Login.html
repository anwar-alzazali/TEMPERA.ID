<label class="form-label">Email</label>
<input type="email" class="form-control" id="email" placeholder="udin@tempera.id" required value="admin@tempera.id">
</div>
<div class="mb-4">
<label class="form-label">Password</label>
<input type="password" class="form-control" id="password" placeholder="Password" required value="Admin123!">
</div>
<button type="submit" class="btn btn-tempera" id="btnLogin">MASUK</button>
</form>
<div class="mt-4 text-center">
<small class="text-muted">Akun Test:<br>admin@tempera.id / Admin123!<br>udin@tempera.id / Tempera123!</small>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
 e.preventDefault();
 const email = document.getElementById('email').value.trim();
 const pass = document.getElementById('password').value;
 const btn = document.getElementById('btnLogin');
 const alertBox = document.getElementById('alert');
 btn.disabled=true; btn.innerText='Loading...';
 try{
   const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
   if(error) throw error;
   // cek role dari profiles
   const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', data.user.id).single();
   console.log('profile',profile);
   alertBox.innerHTML = `<div class="alert alert-success">Login berhasil! Mengalihkan...</div>`;
   if(profile && profile.role==='admin'){
      window.location.href='admin.html';
   }else{
      window.location.href='driver/dashboard.html';
   }
 }catch(err){
   console.error(err);
   alertBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
   btn.disabled=false; btn.innerText='MASUK';
 }
});
</script>
