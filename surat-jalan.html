<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Surat Jalan</title>
<style>
  :root{
    --accent:#0891b2;      /* warna utama surat (sama dengan invoice & panel) */
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --bg:#f1f5f9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:820px;margin:0 auto;padding:16px}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-bottom:12px}
  .btn{border:0;border-radius:999px;padding:10px 20px;font-weight:700;font-size:13px;cursor:pointer}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.6;cursor:wait}

  #surat{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(15,23,42,.08);overflow:hidden}

  .band{background:var(--accent);color:#fff;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px}
  .brand{display:flex;gap:14px;align-items:center}
  .brand img{height:56px;width:auto;max-width:120px;object-fit:contain}
  .brand-name{font-size:19px;font-weight:800;letter-spacing:.02em;line-height:1.25}
  .brand-sub{font-size:12px;opacity:.85}
  .doc{text-align:right}
  .doc-title{font-size:22px;font-weight:800;letter-spacing:.16em}
  .doc-no{font-weight:700;font-size:15px;letter-spacing:.04em}
  .rev{display:inline-block;margin-top:4px;padding:2px 12px;border-radius:999px;background:rgba(255,255,255,.22);font-size:11px;font-weight:800;letter-spacing:.1em}

  .state{padding:10px 28px;font-weight:800;letter-spacing:.05em;text-align:center;font-size:13px}
  .state.bad{background:#fee2e2;color:#991b1b}
  .state.warn{background:#fef3c7;color:#92400e}
  .state.grey{background:#e2e8f0;color:#334155}

  .body{padding:24px 28px 18px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px}
  .box h3,.sec h3{margin:0 0 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .box p{margin:0}
  .strong{font-weight:700}
  .big{font-size:16px}

  .driver{display:flex;justify-content:space-between;align-items:center;gap:16px;border:1.5px solid var(--accent);border-radius:12px;padding:12px 16px;margin-bottom:20px}
  .driver h3{margin:0 0 2px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .driver .nm{font-size:17px;font-weight:800;line-height:1.3}
  .driver .meta{color:var(--muted);font-size:13px}
  .plate{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:18px;letter-spacing:.08em;border:2px solid var(--ink);border-radius:8px;padding:4px 12px;white-space:nowrap;text-align:center}
  .plate small{display:block;font-family:system-ui,sans-serif;font-size:9px;letter-spacing:.12em;color:var(--muted);font-weight:700}

  .route{list-style:none;margin:8px 0 0;padding:0}
  .route li{position:relative;padding:0 0 14px 30px}
  .route li:last-child{padding-bottom:0}
  .route li::before{content:"";position:absolute;left:7px;top:5px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
  .route li::after{content:"";position:absolute;left:13px;top:21px;bottom:-3px;width:2px;background:var(--accent);opacity:.35}
  .route li:last-child::after{display:none}
  .route li.pin::before{background:var(--accent)}
  .route .place{font-weight:800}
  .route .sub{color:var(--muted);font-size:13px}

  .perf{position:relative;border-top:2px dashed #cbd5e1;margin:0 28px}
  .perf span{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#fff;padding:0 10px;font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap}

  .stub{padding:24px 28px 6px;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;break-inside:avoid}
  .qr{text-align:center;width:130px}
  .qr img{width:114px;height:114px;image-rendering:pixelated;border:1px solid var(--line);padding:6px;border-radius:8px;background:#fff;display:block;margin:0 auto}
  .qr .noqr{font-size:10px;color:var(--muted);word-break:break-all}
  .qr small{display:block;margin-top:5px;font-size:10px;color:var(--muted);line-height:1.3}
  .sj-info .no{font-weight:800;font-size:15px}
  .sj-info p{margin:2px 0;color:var(--muted);font-size:12px}
  .sign{text-align:center;min-width:170px}
  .stamp-svg{display:block;width:112px;height:112px;margin:0 auto -6px;position:relative;z-index:1;opacity:.9}
  .stamp-svg text{font-family:Arial,Helvetica,sans-serif}
  .sign img.stamp{max-height:88px;max-width:170px;object-fit:contain;display:block;margin:0 auto 6px}
  .sign .line{border-top:1px solid var(--ink);padding-top:3px;font-weight:700;font-size:13px}
  .sign .ttl{font-size:11px;color:var(--muted)}

  .note{margin:14px 28px 0;padding:10px 12px;border-radius:10px;background:#f8fafc;color:var(--muted);font-size:11.5px}
  .foot{padding:14px 28px 20px;text-align:center;color:var(--muted);font-size:11.5px}
  .state-page{background:#fff;border-radius:16px;padding:40px 20px;text-align:center;color:var(--muted)}
  .state-page.err{color:#b91c1c}

  @media (max-width:600px){
    .band{flex-direction:column;align-items:flex-start;padding:18px 20px}
    .doc{text-align:left}
    .body{padding:20px 20px 16px}
    .cols{grid-template-columns:1fr}
    .driver{flex-direction:column;align-items:flex-start}
    .perf{margin:0 20px}
    .stub{grid-template-columns:1fr;justify-items:center;text-align:center;padding:22px 20px 4px}
    .note{margin:14px 20px 0}
    .state{padding:10px 20px}
  }
  @media print{
    @page{size:A4;margin:8mm}
    body{background:#fff}
    .wrap{padding:0;max-width:none}
    .actions{display:none}
    #surat{box-shadow:none;border-radius:0}
    .band,.stamp-svg,.state{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="actions" id="actions" style="display:none">
    <button class="btn btn-ghost" id="btnPrint" type="button">Cetak</button>
    <button class="btn btn-primary" id="btnPdf" type="button">Simpan PDF</button>
  </div>
  <div id="root"><div class="state-page">Memuat surat jalan…</div></div>
</div>

<script>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbW90aWRlbHFnY3l5dWphY3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE2ODIsImV4cCI6MjEwNDkwNzY4Mn0.kZVRZhw0ryUcT-Pb7akpaO6vR4gOGwCkpD1kvk_uRac';

const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
// urutan tampil rute
const WILAYAH = [['lembang','Lembang'],['dago','Dago'],['ciwidey','Ciwidey'],['pangalengan','Pangalengan']];

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function tglPanjang(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  if (!m) return s || '-';
  const hari = HARI[new Date(+m[1], +m[2] - 1, +m[3]).getDay()];
  return `${hari}, ${+m[3]} ${BULAN[+m[2] - 1]} ${m[1]}`;
}
function tglPendek(iso) {
  if (!iso) return '-';
  try {
    return new Date(iso).toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', day: '2-digit', month: '2-digit', year: 'numeric' });
  } catch (_e) { return String(iso); }
}
function waktuWIB(iso) {
  if (!iso) return '-';
  try {
    return new Date(iso).toLocaleString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' }) + ' WIB';
  } catch (_e) { return String(iso); }
}
// gambar boleh nama file relatif (mis. images/logo.png) atau alamat penuh
function imgSrc(u, site) {
  if (!u) return '';
  if (/^(https?:|data:)/i.test(u)) return u;
  return (site ? site + '/' : '') + u.replace(/^\/+/, '');
}

// Logo dijadikan satu warna (putih di atas band). false = pakai warna asli logo.
const LOGO_WARNA = true;

// Logo PNG transparan digambar ulang di kanvas: ruang kosong di tepinya dipangkas lalu diberi satu warna.
// Hasilnya berupa gambar biasa, jadi ikut terbawa saat disimpan ke PDF.
function tintLogo(url, color) {
  return new Promise((resolve) => {
    const im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = () => {
      try {
        const k = Math.min(1, 400 / Math.max(im.naturalWidth, im.naturalHeight));
        const w = Math.max(1, Math.round(im.naturalWidth * k)), h = Math.max(1, Math.round(im.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const x = c.getContext('2d');
        x.drawImage(im, 0, 0, w, h);
        const px = x.getImageData(0, 0, w, h).data;
        let x0 = w, y0 = h, x1 = -1, y1 = -1;
        for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
          if (px[(yy * w + xx) * 4 + 3] > 8) { if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (yy < y0) y0 = yy; if (yy > y1) y1 = yy; }
        }
        if (x1 < 0) return resolve('');
        const c2 = document.createElement('canvas'); c2.width = x1 - x0 + 1; c2.height = y1 - y0 + 1;
        const x2 = c2.getContext('2d');
        x2.drawImage(c, x0, y0, c2.width, c2.height, 0, 0, c2.width, c2.height);
        x2.globalCompositeOperation = 'source-in';
        x2.fillStyle = color; x2.fillRect(0, 0, c2.width, c2.height);
        resolve(c2.toDataURL('image/png'));
      } catch (_e) { resolve(''); }   // gagal (mis. dilarang lintas situs): pakai logo asli
    };
    im.onerror = () => resolve('');
    im.src = url;
  });
}

// Menyiapkan logo teal sekali (dipakai di tengah QR). Mengembalikan Image siap-pakai, atau null bila gagal.
async function siapkanLogoQr(co, site) {
  if (!co || !co.logo_url) return null;
  try {
    const tinted = await tintLogo(imgSrc(co.logo_url, site), '#0891b2');
    if (!tinted) return null;
    const im = new Image();
    await new Promise((res) => { im.onload = res; im.onerror = res; im.src = tinted; });
    return im.naturalWidth ? im : null;
  } catch (_e) { return null; }
}

// QR digambar sendiri di kanvas (bukan lewat createDataURL) supaya logo bisa dicap di tengahnya.
// Level H dipakai karena tengah QR tertutup logo.
function buildQrCanvas(text, size, logoImg) {
  const q = qrcode(0, 'H'); q.addData(text); q.make();
  const n = q.getModuleCount(), quiet = 2;
  const cell = Math.max(1, Math.floor(size / (n + quiet * 2)));
  const total = cell * (n + quiet * 2);
  const c = document.createElement('canvas'); c.width = c.height = total;
  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, total, total);
  x.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) {
    if (q.isDark(r, k)) x.fillRect((k + quiet) * cell, (r + quiet) * cell, cell, cell);
  }
  if (logoImg) {
    const plate = Math.round(total * 0.22), pad = Math.round(plate * 0.08);
    const lh = Math.round((plate - pad * 2) * (logoImg.naturalHeight / logoImg.naturalWidth));
    const lw = plate - pad * 2;
    const px = Math.round((total - plate) / 2);
    x.fillStyle = '#fff'; x.beginPath();
    if (x.roundRect) x.roundRect(px, px, plate, plate, plate * 0.18); else x.rect(px, px, plate, plate);
    x.fill();
    x.drawImage(logoImg, px + pad, px + Math.round((plate - lh) / 2), lw, lh);
  }
  return c;
}

// Kota di lengkungan bawah stempel (ubah di sini bila pindah kota)
const STAMP_BOTTOM = 'BANDUNG \u00B7 JAWA BARAT';

// Stempel bulat digambar dari nama usaha. Warna ditulis langsung (bukan variabel CSS)
// supaya ikut terbawa saat disimpan ke PDF.
function stampSvg(co, s, state) {
  const bad = state === 'dibatalkan' || state === 'tidak_berlaku';
  const old = state === 'lewat';
  const col = bad ? '#b91c1c' : old ? '#64748b' : '#0e7490';
  // nama maks. 24 huruf agar muat di lengkungan; ukuran huruf menyesuaikan panjang nama
  const name = String(co.name || '').toUpperCase().slice(0, 24);
  const fs = Math.max(8.5, Math.min(16, (170 / Math.max(name.length, 1) - 1.2) / 0.68));
  const bottom = String(STAMP_BOTTOM).toUpperCase();

  let tgl = '';
  try {
    tgl = new Date(s.terbit).toLocaleDateString('id-ID', { timeZone: 'Asia/Jakarta', day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase().replace(/\./g, '');
  } catch (_e) { tgl = ''; }
  const upper = bad || old ? 'STATUS' : 'DITERBITKAN';
  const mid = bad ? 'BATAL' : old ? 'LEWAT' : tgl;

  // bintang 5 sudut
  const pts = [];
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 11 : 4.6, a = -Math.PI / 2 + (i * Math.PI) / 5;
    pts.push((100 + r * Math.cos(a)).toFixed(1) + ',' + (72 + r * Math.sin(a)).toFixed(1));
  }

  return `<svg class="stamp-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Stempel ${esc(co.name)}">
    <defs>
      <path id="stTop" d="M 100,100 m -68,0 a 68,68 0 0 1 136,0"/>
      <path id="stBot" d="M 100,100 m -80,0 a 80,80 0 0 0 160,0"/>
    </defs>
    <g transform="rotate(-10 100 100)" fill="${col}" stroke="none">
      <circle cx="100" cy="100" r="96" fill="none" stroke="${col}" stroke-width="4"/>
      <circle cx="100" cy="100" r="90" fill="none" stroke="${col}" stroke-width="1.2"/>
      <circle cx="100" cy="100" r="58" fill="none" stroke="${col}" stroke-width="1.6"/>
      <text font-size="${fs}" font-weight="700" letter-spacing="1.5" text-anchor="middle"><textPath href="#stTop" startOffset="50%">${esc(name)}</textPath></text>
      <text font-size="10.5" font-weight="700" letter-spacing="2.2" text-anchor="middle"><textPath href="#stBot" startOffset="50%">${esc(bottom)}</textPath></text>
      <circle cx="26" cy="100" r="3"/><circle cx="174" cy="100" r="3"/>
      <polygon points="${pts.join(' ')}"/>
      <text x="100" y="95" font-size="8.5" font-weight="700" letter-spacing="1.6" text-anchor="middle">${upper}</text>
      <line x1="56" y1="99.5" x2="144" y2="99.5" stroke="${col}" stroke-width="1"/>
      <text x="100" y="115" font-size="${bad || old ? 16 : 12.5}" font-weight="800" letter-spacing="${bad || old ? 2 : 0.6}" text-anchor="middle">${esc(mid)}</text>
      <line x1="56" y1="121" x2="144" y2="121" stroke="${col}" stroke-width="1"/>
      <text x="100" y="134" font-size="8.5" font-weight="700" letter-spacing="0.8" text-anchor="middle">${esc(s.sj_no)}</text>
    </g>
  </svg>`;
}

function buildSurat(d, qrLogoImg) {
  const s = d.surat, co = d.company, sg = d.signer, site = d.site_url || '';

  const logo = co.logo_url ? `<img src="${esc(imgSrc(co.logo_url, site))}" alt="${esc(co.name)}" crossorigin="anonymous">` : '';
  const alamat = [co.address, co.contact].filter(Boolean).map(esc).join(' &middot; ');

  // banner status
  let banner = '';
  if (d.state === 'dibatalkan') banner = '<div class="state bad">DIBATALKAN &mdash; SURAT JALAN INI TIDAK BERLAKU</div>';
  else if (d.state === 'tidak_berlaku') banner = '<div class="state bad">TIDAK BERLAKU &mdash; PEMESANAN BELUM/TIDAK VALID</div>';
  else if (d.state === 'lewat') banner = '<div class="state grey">TRIP SUDAH LEWAT &mdash; SURAT INI TIDAK BERLAKU LAGI</div>';
  else if (s.driver_aktif === false) banner = '<div class="state warn">DRIVER PADA SURAT INI SUDAH TIDAK AKTIF &mdash; HUBUNGI ADMIN UNTUK REVISI</div>';

  // rute
  const dests = s.destinations || {};
  const nodes = WILAYAH
    .filter(([k]) => Array.isArray(dests[k]) && dests[k].length)
    .map(([k, nama]) => `<li><div class="place">${esc(nama)}</div><div class="sub">${dests[k].map(esc).join(' &rarr; ')}</div></li>`)
    .join('');
  const route = `
    <ol class="route">
      <li class="pin"><div class="place">Titik jemput</div><div class="sub">${esc(s.pickup_note || '-')}</div></li>
      ${nodes || '<li><div class="place">Destinasi</div><div class="sub">-</div></li>'}
      <li class="pin"><div class="place">Selesai</div><div class="sub">Diantar kembali ke titik jemput</div></li>
    </ol>`;

  // QR verifikasi
  let verifyUrl = d.verify.url;
  if (!verifyUrl) {
    verifyUrl = new URL(`verifikasi.html?n=${encodeURIComponent(d.verify.n)}&r=${d.verify.r}&c=${d.verify.c}`, location.href).href;
  }
  let qrBlock;
  if (typeof qrcode === 'function') {
    const c = buildQrCanvas(verifyUrl, 240, qrLogoImg);
    qrBlock = `<img src="${c.toDataURL('image/png')}" alt="QR verifikasi">`;
  } else {
    qrBlock = `<div class="noqr">${esc(verifyUrl)}</div>`;
  }

  // stempel: gambar milikmu (bila diisi di Pengaturan) atau stempel bawaan
  const stamp = sg.stamp_url
    ? `<img class="stamp" src="${esc(imgSrc(sg.stamp_url, site))}" alt="Stempel" crossorigin="anonymous">`
    : stampSvg(co, s, d.state);

  return `
  <div id="surat">
    <div class="band">
      <div class="brand">${logo}<div>
        <div class="brand-name">${esc(co.name)}</div>
        <div class="brand-sub">${esc(co.tagline)}</div>
      </div></div>
      <div class="doc">
        <div class="doc-title">SURAT JALAN</div>
        <div class="doc-no">${esc(s.sj_no)}</div>
        <span class="rev">REVISI ${esc(s.rev)}</span>
      </div>
    </div>
    ${banner}

    <div class="body">
      <div class="cols">
        <div class="box">
          <h3>Perjalanan</h3>
          <p class="strong big">${esc(tglPanjang(s.trip_date))}</p>
          <p>Jam jemput ${esc(s.trip_time || '-')} &middot; ${esc(s.pax != null ? s.pax : '-')} peserta</p>
          <p>${esc(s.fleet_name || '-')}</p>
        </div>
        <div class="box">
          <h3>Pemesan / ketua rombongan</h3>
          <p class="strong big">${esc(s.customer_name || '-')}</p>
        </div>
      </div>

      <div class="driver">
        <div>
          <h3>Pelaksana &middot; mitra pengemudi</h3>
          <div class="nm">${esc(s.driver_name || '-')}</div>
          <div class="meta">ID ${esc(s.driver_code || '-')}${s.vehicle_type ? ' &middot; ' + esc(s.vehicle_type) : ''}</div>
        </div>
        <div class="plate"><small>PLAT NOMOR</small>${esc(s.plate || '-')}</div>
      </div>

      <div class="sec">
        <h3>Rute perjalanan</h3>
        ${route}
      </div>
    </div>

    <div class="perf"><span>Bagian verifikasi</span></div>
    <div class="stub">
      <div class="qr">${qrBlock}<small>Pindai untuk memeriksa keaslian surat</small></div>
      <div class="sj-info">
        <div class="no">${esc(s.sj_no)} &middot; Rev ${esc(s.rev)}</div>
        <p>Diterbitkan ${esc(waktuWIB(s.terbit))}</p>
        <p>Surat hanya sah bila QR menampilkan status &ldquo;Sah&rdquo; dan revisi terbaru.</p>
      </div>
      <div class="sign">
        ${stamp}
        <div class="line">${esc(sg.name || co.name)}</div>
        <div class="ttl">${esc(sg.title)}</div>
      </div>
    </div>

    ${d.note ? `<div class="note">${esc(d.note)}</div>` : ''}
    <div class="foot">${alamat}</div>
  </div>`;
}

async function load() {
  const root = document.getElementById('root');
  const t = new URLSearchParams(location.search).get('t') || '';
  if (!/^[a-f0-9]{32}$/i.test(t)) {
    root.innerHTML = '<div class="state-page err">Link surat jalan tidak valid.</div>';
    return;
  }
  try {
    const r = await fetch(`${SB_URL}/functions/v1/get-surat-jalan?t=${encodeURIComponent(t)}`, {
      headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const d = await r.json();
    if (!d.ok) {
      root.innerHTML = `<div class="state-page err">${esc(d.error || 'Surat jalan tidak dapat dibuka.')}</div>`;
      return;
    }
    const qrLogoImg = await siapkanLogoQr(d.company, d.site_url || '');
    root.innerHTML = buildSurat(d, qrLogoImg);
    const lg = root.querySelector('.brand img');
    if (LOGO_WARNA && lg) { const u = await tintLogo(lg.src, '#ffffff'); if (u) lg.src = u; }
    document.title = 'Surat Jalan ' + d.surat.sj_no + ' rev ' + d.surat.rev;
    document.getElementById('actions').style.display = 'flex';
    window.__sj = d.surat.sj_no + '-rev' + d.surat.rev;
  } catch (e) {
    console.error(e);
    root.innerHTML = '<div class="state-page err">Gagal memuat surat jalan. Periksa koneksi internet lalu muat ulang.</div>';
  }
}

async function savePdf() {
  const btn = document.getElementById('btnPdf');
  const src = document.getElementById('surat');
  if (!src) return;
  btn.disabled = true; const old = btn.textContent; btn.textContent = 'Menyiapkan…';
  // Sama seperti invoice: A4 tanpa margin kertas, lebar jendela 794px, lebar tidak dipaksa.
  const clone = src.cloneNode(true);
  clone.style.margin = '0'; clone.style.boxShadow = 'none'; clone.style.borderRadius = '0';
  try {
    if (typeof html2pdf === 'undefined') throw new Error('html2pdf tidak termuat');
    await html2pdf().set({
      margin: 0,
      filename: (window.__sj || 'surat-jalan') + '.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 2, useCORS: true, windowWidth: 794, scrollX: 0, scrollY: 0 },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'] }
    }).from(clone).save();
  } catch (e) {
    console.error(e);
    window.print(); // cadangan: pilih "Simpan sebagai PDF" di jendela cetak
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
}

document.getElementById('btnPrint').addEventListener('click', () => window.print());
document.getElementById('btnPdf').addEventListener('click', savePdf);
load();
</script>
