<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - TEMPERA.ID</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:#f6f9fc;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Poppins',sans-serif}
.login-card{background:white;border-radius:20px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,0.1);width:100%;max-width:420px}
.logo{font-weight:800;color:#0ea5e9;font-size:24px;text-align:center;margin-bottom:30px}
.btn-tempera{background:#0ea5e9;color:white;border-radius:50px;padding:12px;font-weight:600;width:100%}
.btn-tempera:hover{background:#0284c7;color:white}
</style>
</head>
<body>
<div class="login-card">
<div class="logo">TEMPERA.ID<br><small style="font-size:12px;color:#64748b;font-weight:400">Private Trip Bandung</small></div>
<h5 class="mb-3 text-center">Login Driver / Admin</h5>
<div id="alert"></div>
<form id="loginForm">
<div class="mb-3">
<label class="form-label">Email</label>
<input type="email" class="form-control" id="email" placeholder="udin@tempera.id" required value="admin@tempera.id">
</div>
<div class="mb-4">
<label class="form-label">Password</label>
<input type="password" class="form-control" id="password" placeholder="Password" required>
</div>
<button type="submit" class="btn btn-tempera" id="btnLogin">MASUK</button>
</form>
<div class="mt-4 text-center">
<small class="text-muted">Akun Test:<br>admin@tempera.id / Admin123!<br>udin@tempera.id / Tempera123!</small>
</div>
<div class="mt-3 text-center"><a href="index.html" style="text-decoration:none;font-size:13px">← Kembali ke Beranda</a></div>
</div>

<script type="module">
// FIX FINAL: pakai esm.sh versi 2.45.4 yang support sb_publishable_
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.45.4'

const SUPABASE_URL = 'https://wjmotidqelgcyujacud.supabase.co'
// Kunci publishable kamu yang dari screenshot - AMAN untuk browser
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbW90aWRlbHFnY3l5dWphY3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE2ODIsImV4cCI6MjEwNDkwNzY4Mn0.kZVRZhw0ryUcT-Pb7akpaO6vR4gOGwCkpD1kvk_uRac'

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
 e.preventDefault();
 const email = document.getElementById('email').value.trim();
 const pass = document.getElementById('password').value;
 const btn = document.getElementById('btnLogin');
 const alertBox = document.getElementById('alert');
 btn.disabled=true; btn.innerText='Loading...';
 try{
   const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
   if(error) throw error;
   // ambil profile
   const { data: profile } = await supabase.from('profiles').select('*').eq('id', data.user.id).single();
   console.log('profile',profile);
   alertBox.innerHTML = `<div class="alert alert-success">Login berhasil! Mengalihkan...</div>`;
   setTimeout(()=>{
     if(profile && profile.role==='admin'){
        window.location.href='admin.html';
     }else{
        window.location.href='driver/dashboard.html';
     }
   }, 800);
 }catch(err){
   console.error(err);
   alertBox.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
   btn.disabled=false; btn.innerText='MASUK';
 }
});
</script>
</body>
</html>
