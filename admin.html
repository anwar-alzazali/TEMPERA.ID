<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPERA.ID - Panel Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FIX: Updated QR Code Styling CDN -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-500 text-slate-950 p-2 rounded-xl font-bold tracking-wider text-lg shadow-lg shadow-amber-500/20">
                    TEMPERA.ID
                </div>
                <span class="text-xs uppercase bg-slate-800 text-amber-400 px-2.5 py-1 rounded-md font-semibold tracking-wider border border-amber-500/30">Panel Admin</span>
            </div>
            <div class="flex items-center space-x-4">
                <button onclick="openAddDriverModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl font-semibold text-sm transition shadow-lg shadow-amber-500/20 flex items-center space-x-2">
                    <i class="fa-solid fa-user-plus"></i>
                    <span>Tambah Driver</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div class="mb-8">
            <h1 class="text-2xl font-bold text-white tracking-wide">Driver Management</h1>
            <p class="text-sm text-slate-400 mt-1">Kelola data driver, status keaktifan, dan unduh QR code profil.</p>
        </div>

        <!-- Driver Card Grid / Management Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="driver-list-container">
            <!-- Driver Card Example -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden flex flex-col justify-between">
                <div>
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center space-x-3">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Kang Udin" class="w-12 h-12 rounded-full object-cover border-2 border-amber-500">
                            <div>
                                <h3 class="font-bold text-white text-base">Kang Udin</h3>
                                <p class="text-xs text-amber-400 font-medium">/r/udin</p>
                            </div>
                        </div>
                        <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs px-2.5 py-1 rounded-full font-medium">Aktif</span>
                    </div>

                    <div class="space-y-2 text-sm text-slate-300 mb-6 border-t border-slate-800/80 pt-4">
                        <div class="flex items-center space-x-2">
                            <i class="fa-brands fa-whatsapp text-emerald-400 w-5"></i>
                            <span>6281223456789</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-car text-amber-400 w-5"></i>
                            <span>Avanza</span>
                        </div>
                        <div class="flex items-center space-x-2">
                            <i class="fa-solid fa-star text-amber-400 w-5"></i>
                            <span>4.9</span>
                        </div>
                        <div class="flex items-center space-x-2 italic text-slate-400">
                            <i class="fa-solid fa-quote-left text-slate-500 w-5"></i>
                            <span>"Trip santai"</span>
                        </div>
                    </div>
                </div>

                <div>
                    <!-- FIX: QR Code Container Target -->
                    <div id="qr-code-udin" class="bg-white p-3 rounded-xl flex justify-center items-center mb-4 shadow-inner min-h-[160px]"></div>

                    <div class="flex space-x-2">
                        <button class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2 rounded-xl text-xs font-semibold transition border border-slate-700">Nonaktifkan</button>
                        <button class="flex-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 border border-amber-500/30 py-2 rounded-xl text-xs font-semibold transition">Edit</button>
                    </div>
                    <div class="mt-3 text-center">
                        <button onclick="downloadQR('udin')" class="text-xs text-amber-400 hover:text-amber-300 font-semibold underline underline-offset-4">Download QR PNG</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        &copy; 2026 TEMPERA.ID - All Rights Reserved.
    </footer>

    <!-- Modal Tambah Driver (Sudah tersedia & siap dipanggil) -->
    <div id="addDriverModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
            <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
                <h3 class="text-lg font-bold text-white">Tambah Driver Baru</h3>
                <button onclick="closeAddDriverModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="handleAddDriver(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nama Driver</label>
                    <input type="text" id="driverName" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Nomor WhatsApp</label>
                    <input type="text" id="driverPhone" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Kendaraan</label>
                    <input type="text" id="driverVehicle" required class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeAddDriverModal()" class="bg-slate-800 text-slate-300 px-4 py-2 rounded-xl text-xs font-semibold">Batal</button>
                    <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-4 py-2 rounded-xl text-xs font-semibold">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- FIX: Script untuk Inisialisasi & Render QR Code dengan Aman -->
    <script>
        let qrCodeInstance;

        function initQR() {
            const container = document.getElementById("qr-code-udin");
            if (!container) return;
            
            container.innerHTML = ""; // Bersihkan kontainer sebelum render

            try {
                qrCodeInstance = new QRCodeStyling({
                    width: 150,
                    height: 150,
                    type: "canvas",
                    data: "https://tempera.id/driver/udin",
                    dotsOptions: {
                        color: "#0f172a",
                        type: "rounded"
                    },
                    backgroundOptions: {
                        color: "#ffffff",
                    },
                    cornersSquareOptions: {
                        type: "extra-rounded",
                        color: "#0f172a"
                    },
                    imageOptions: {
                        crossOrigin: "anonymous",
                        imageSize: 0.4,
                        hideBackgroundDots: true
                    }
                });
                qrCodeInstance.append(container);
            } catch (e) {
                console.error("Gagal merender QR Code:", e);
                container.innerHTML = "<span class='text-xs text-red-500 font-semibold'>Gagal memuat QR Code</span>";
            }
        }

        function downloadQR(name) {
            if (qrCodeInstance) {
                qrCodeInstance.download({ name: `QR-Driver-${name}`, extension: "png" });
            }
        }

        function openAddDriverModal() {
            document.getElementById('addDriverModal').classList.remove('hidden');
        }

        function closeAddDriverModal() {
            document.getElementById('addDriverModal').classList.add('hidden');
        }

        function handleAddDriver(e) {
            e.preventDefault();
            alert('Fitur tambah driver berhasil diproses!');
            closeAddDriverModal();
        }

        // Jalankan saat halaman siap
        document.addEventListener("DOMContentLoaded", function() {
            initQR();
        });
    </script>
</body>
</html>
