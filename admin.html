<!DOCTYPE html><html><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Admin - TEMPERA</title><link href=https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css rel=stylesheet></head><body style=background:#f8fafc;font-family:sans-serif><div class="container-fluid"><div class=row><div class="col-3 p-4" style=background:#0f172a;min-height:100vh;color:#fff><h4>TEMPERA.ID</h4><small>Admin</small><hr><a href=admin.html class="btn btn-primary w-100">Dashboard</a><a href=index.html class="btn btn-outline-light w-100 mt-2">Website</a><button onclick=logout() class="btn btn-danger w-100 mt-4">Logout</button></div><div class="col-9 p-4"><h3>Dashboard Admin</h3><div id=welcome class="alert alert-success"></div><div id=bookingList>Loading bookings...</div></div></div></div><script type=module>
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/+esm'
const URL='https://wjmotidelqgcyyujacud.supabase.co'
const KEY=localStorage.getItem('tempera_anon_key_bener')||localStorage.getItem('tempera_anon_key')||''
if(!KEY) location.href='login.html'
const supabase=createClient(URL,KEY)
const {data:{user}}=await supabase.auth.getUser()
if(!user) location.href='login.html'
else document.getElementById('welcome').innerText='Login sebagai: '+user.email+' ✅ Berhasil!'
window.logout=async()=>{await supabase.auth.signOut();location.href='login.html'}
<\/script></body></html>
