<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMPERA.ID - Admin Panel</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- QRCode Styling CDN -->
    <script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <style>
        .gold-gradient { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .bg-dark-custom { background-color: #121212; }
        .bg-card-custom { background-color: #1e1e1e; }
    </style>
</head>
<body class="bg-dark-custom text-gray-100 font-sans antialiased min-h-screen">

    <!-- LOGIN MODAL / SCREEN -->
    <div id="loginScreen" class="fixed inset-0 bg-black bg-opacity-95 flex items-center justify-center p-4 z-[9999]">
        <div class="bg-card-custom p-8 rounded-xl border border-amber-500/30 max-w-md w-full text-center shadow-2xl relative z-[10000]">
            <img src="https://anwar-alzazali.github.io/TEMPERA.ID/images/logo_classic_gold_transparent.png" alt="Logo TEMPERA" class="h-24 mx-auto mb-4 object-contain">
            
            <h2 class="text-2xl font-bold text-amber-400 mb-2">TEMPERA.ID Admin</h2>
            <p class="text-gray-400 text-sm mb-6">Masukkan kata sandi admin untuk melanjutkan</p>
            
            <form onsubmit="event.preventDefault(); checkPassword();" class="space-y-4">
                <input type="password" id="passwordInput" autocomplete="current-password" placeholder="Password Admin" 
                       class="w-full p-3 bg-gray-900 border border-gray-700 rounded-lg text-white text-center focus:outline-none focus:border-amber-500 relative z-[10001] pointer-events-auto">
                
                <button type="submit" 
                        class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-black font-bold rounded-lg transition-colors cursor-pointer relative z-[10001] pointer-events-auto">
                    Masuk Panel
                </button>
            </form>
            
            <p id="loginError" class="text-red-500 text-sm mt-3 hidden">Password salah, coba lagi!</p>
        </div>
    </div>

    <!-- MAIN ADMIN APP -->
    <div id="adminApp" class="hidden min-h-screen flex flex-col md:flex-row">

        <!-- SIDEBAR -->
        <aside class="w-full md:w-64 bg-card-custom border-r border-gray-800 flex flex-col">
            <div class="p-5 border-b border-gray-800 flex items-center gap-3">
                <img src="https://anwar-alzazali.github.io/TEMPERA.ID/images/logo_classic_gold_transparent.png" alt="Logo Gold" class="h-10 w-10 object-contain">
                <div>
                    <h1 class="font-bold text-amber-400 text-lg leading-none">TEMPERA.ID</h1>
                    <span class="text-xs text-gray-400">Admin Control Panel</span>
                </div>
            </div>
            
            <nav class="flex-1 p-4 space-y-2">
                <button onclick="switchTab('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold text-amber-400 bg-gray-800/60 rounded-lg">
                    <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                </button>
                <button onclick="switchTab('drivers')" class="w-full flex items-center gap-3 px-4 py-3 text-sm font-semibold text-gray-400 hover:text-amber-400 hover:bg-gray-800/40 rounded-lg">
                    <i class="fa-solid fa-id-card w-5"></i> Driver Management
                </button>
            </nav>

            <div class="p-4 border-t border-gray-800">
                <button onclick="logout()" class="w-full flex items-center justify-center gap-2 px-4 py-2 text-xs font-semibold text-red-400 bg-red-950/30 hover:bg-red-900/50 rounded-lg border border-red-800/40">
                    <i class="fa-solid fa-right-from-bracket"></i> Keluar
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 p-6 overflow-y-auto">
            <!-- DASHBOARD TAB -->
            <div id="tab-dashboard" class="space-y-6">
                <h2 class="text-2xl font-bold text-amber-400">Dashboard Utama</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-card-custom p-5 rounded-xl border border-gray-800">
                        <p class="text-xs text-gray-400">Total Driver</p>
                        <h3 id="statTotalDrivers" class="text-3xl font-bold text-white mt-2">0</h3>
                    </div>
                </div>
            </div>

            <!-- DRIVERS TAB -->
            <div id="tab-drivers" class="hidden space-y-6">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-amber-400">Driver Management</h2>
                </div>
                <div id="driversListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Drivers cards generated dynamically -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // INIT SUPABASE
        const SUPABASE_URL = "https://xyzcompany.supabase.co"; // Ganti dengan Supabase URL Anda
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; // Ganti dengan Supabase Anon Key Anda
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorElement = document.getElementById('loginError');
            
            // Default master password check & fallback ke Supabase
            if (input === 'admin123') {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('adminApp').classList.remove('hidden');
                loadDrivers();
                return;
            }

            try {
                const { data } = await supabaseClient.from('settings').select('value').eq('key', 'admin_password').single();
                if (data && data.value === input) {
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('adminApp').classList.remove('hidden');
                    loadDrivers();
                } else {
                    errorElement.classList.remove('hidden');
                }
            } catch (err) {
                errorElement.classList.remove('hidden');
            }
        }

        function switchTab(tabName) {
            document.getElementById('tab-dashboard').classList.add('hidden');
            document.getElementById('tab-drivers').classList.add('hidden');
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
        }

        async function loadDrivers() {
            const { data: drivers } = await supabaseClient.from('drivers').select('*').order('id');
            const container = document.getElementById('driversListContainer');
            if (!container) return;
            container.innerHTML = '';

            document.getElementById('statTotalDrivers').innerText = drivers ? drivers.length : 0;

            drivers?.forEach(d => {
                const card = document.createElement('div');
                card.className = 'bg-card-custom p-5 rounded-xl border border-gray-800 space-y-4';
                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <img src="${d.photo_url || 'https://via.placeholder.com/150'}" class="w-16 h-16 rounded-full object-cover border-2 border-amber-500">
                        <div>
                            <h3 class="font-bold text-white text-lg">${d.name}</h3>
                            <p class="text-xs text-amber-400">/r/${d.slug}</p>
                        </div>
                    </div>
                    <div class="pt-2 border-t border-gray-800 flex flex-col items-center gap-2">
                        <div id="qr-${d.slug}" class="p-2 bg-white rounded-lg"></div>
                        <button onclick="downloadQR('${d.slug}')" class="text-xs text-amber-400 underline hover:text-amber-300 mt-1">
                            Download QR PNG
                        </button>
                    </div>
                `;
                container.appendChild(card);

                setTimeout(() => {
                    const qrElement = document.getElementById(`qr-${d.slug}`);
                    if (qrElement) {
                        const qrCode = new QRCodeStyling({
                            width: 160,
                            height: 160,
                            data: `https://anwar-alzazali.github.io/TEMPERA.ID/?r=${d.slug}`,
                            image: "https://anwar-alzazali.github.io/TEMPERA.ID/images/logo_classic_gold_transparent.png",
                            dotsOptions: { color: "#000000", type: "rounded" },
                            backgroundOptions: { color: "#ffffff" },
                            imageOptions: { crossOrigin: "anonymous", margin: 2, imageSize: 0.25 }
                        });
                        qrCode.append(qrElement);
                    }
                }, 100);
            });
        }

        function downloadQR(slug) {
            const qrCode = new QRCodeStyling({
                width: 600,
                height: 600,
                data: `https://anwar-alzazali.github.io/TEMPERA.ID/?r=${slug}`,
                image: "https://anwar-alzazali.github.io/TEMPERA.ID/images/logo_classic_gold_transparent.png",
                dotsOptions: { color: "#000000", type: "rounded" },
                backgroundOptions: { color: "#ffffff" },
                imageOptions: { crossOrigin: "anonymous", margin: 8, imageSize: 0.25 }
            });
            qrCode.download({ name: `QR-Driver-${slug}`, extension: "png" });
        }

        function logout() {
            document.getElementById('adminApp').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('passwordInput').value = '';
        }
    </script>
</body>
</html>
