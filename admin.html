<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin TEMPERA - ANTI STRIPPED</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-slate-100 p-4">
<div class="max-w-3xl mx-auto bg-white p-5 rounded-2xl shadow">
<h1 class="font-black">ADMIN TEMPERA - VERSI AMAN (ANTI STRIPPED)</h1>
<p class="text-xs text-gray-500 mb-3">Key TIDAK disimpan di file, tapi kamu paste disini. Aman, tidak ke-filter.</p>

<div class="bg-yellow-50 border p-3 rounded-xl mb-4">
<div class="text-xs font-bold">1. URL Supabase</div>
<input id="url" class="border w-full p-2 rounded text-xs mb-2" value="https://wjmotidelqgcyyujacud.supabase.co">
<div class="text-xs font-bold">2. Legacy Anon Key (paste full eyJ...)</div>
<textarea id="key" rows="3" class="border w-full p-2 rounded text-xs" placeholder="Paste disini key eyJhbGc... yang 210 huruf tadi"></textarea>
<button onclick="save()" class="mt-2 bg-black text-white px-4 py-2 rounded font-bold text-xs">SIMPAN & KONEK</button>
<div id="stat" class="mt-2 text-xs font-mono"></div>
</div>

<div class="grid grid-cols-2 gap-3 mb-3"><div class="bg-gray-50 p-3 rounded">Total Sales<div id="total" class="text-xl font-black">-</div></div><div class="bg-gray-50 p-3 rounded">Log<div id="err" class="text-xs">-</div></div></div>
<div id="list" class="space-y-2"></div>
<pre id="log" class="bg-black text-green-400 p-2 rounded text-xs mt-3 overflow-auto"></pre>
</div>

<div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4"><div class="bg-white p-4 rounded-xl w-full max-w-sm"><input type="hidden" id="eid"><input id="enama" class="border w-full p-2 rounded mb-2 text-sm"><input id="ewa" class="border w-full p-2 rounded mb-2 text-sm"><div class="flex gap-2"><button onclick="document.getElementById('modal').classList.add('hidden')" class="flex-1 bg-gray-200 py-2 rounded">Batal</button><button onclick="doSave()" class="flex-1 bg-black text-white py-2 rounded">Simpan</button></div></div></div>

<script>
let supabase=null;
const $=id=>document.getElementById(id);
function log(m){$('log').textContent+=m+'\n'}
function save(){
  const u=$('url').value.trim();
  const k=$('key').value.trim();
  if(k.length<100){alert('Key kependekan');return;}
  localStorage.setItem('t_url',u); localStorage.setItem('t_key',k);
  $('stat').innerText='Disimpan, konek...';
  connect();
}
async function connect(){
  const url=localStorage.getItem('t_url')||$('url').value.trim();
  const key=localStorage.getItem('t_key')||$('key').value.trim();
  if(!key){$('stat').innerHTML='<span style=color:red>Belum ada key, paste dulu</span>';return;}
  $('url').value=url; $('key').value=key;
  try{
    supabase=window.supabase.createClient(url,key);
    $('stat').innerText='Client ok, select profiles...';
    const {data,error}=await supabase.from('profiles').select('*').order('created_at');
    if(error){$('stat').innerHTML='<span style=color:red>'+error.message+'</span>';$('err').innerText=error.message;log(JSON.stringify(error));return;}
    $('stat').innerHTML='<span style=color:green>Terhubung ✅ '+data.length+' sales</span>';
    $('total').innerText=data.length; $('err').innerText='OK';
    $('list').innerHTML=data.map(p=>`<div class="border p-2 rounded flex justify-between items-center text-sm"><div><b>${p.nama}</b> /${p.slug}<br><span class="font-mono text-xs">${p.wa_number||'NULL'}</span></div><div><button onclick="openE('${p.id}','${p.nama}','${p.wa_number||''}')" class="bg-yellow-400 px-2 py-1 rounded text-xs font-bold">GANTI NOMOR</button></div></div>`).join('');
    log('OK '+data.length+' sales');
  }catch(e){$('stat').innerText=e.message; log(e.message)}
}
window.openE=(id,n,wa)=>{$('modal').classList.remove('hidden');$('eid').value=id;$('enama').value=n;$('ewa').value=wa}
window.doSave=async()=>{
  const id=$('eid').value; let wa=$('ewa').value.replace(/[^0-9]/g,''); const nama=$('enama').value;
  if(!wa.startsWith('62')){alert('Harus 62');return;}
  const {error}=await supabase.from('profiles').update({wa_number:wa,nama}).eq('id',id);
  if(error){alert(error.message);return;}
  $('modal').classList.add('hidden'); connect();
}
if(localStorage.getItem('t_key')) connect();
</script>
</body></html>
