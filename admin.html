<!DOCTYPE html>
<html lang="id">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Driver Fleet TEMPERA.ID</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white min-h-screen p-4">
<div class="max-w-4xl mx-auto">
<div class="flex items-center gap-3 mb-6">
<div class="w-10 h-10 bg-[#D4AF37] rounded-full flex items-center justify-center text-black font-black">T</div>
<h1 class="text-xl font-bold tracking-widest">TEMPERA</h1>
<span class="ml-auto text-xs text-zinc-500">ACTIVE • DRIVERS • <span id="count">0</span></span>
</div>

<h2 class="text-4xl font-serif mb-2">Driver Fleet</h2>
<p class="text-zinc-500 text-sm mb-6">Kelola driver luxury • Foto otomatis tampil di /r/{slug} dan /driver/{slug}</p>

<button id="btnAdd" class="bg-[#D4AF37] text-black font-bold px-6 py-3 rounded-full text-sm mb-6">+ Tambah Driver</button>

<!-- FORM -->
<div id="formBox" class="hidden bg-zinc-900 border border-zinc-800 rounded-[20px] p-5 mb-6">
<h3 class="font-bold mb-4">Tambah / Edit Driver</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<input id="f_name" placeholder="Nama: Budi Santoso" class="bg-black border border-zinc-800 rounded-xl p-3 text-sm">
<input id="f_slug" placeholder="Slug: budi-santoso (huruf kecil, tanpa spasi)" class="bg-black border border-zinc-800 rounded-xl p-3 text-sm">
<input id="f_base" placeholder="Base: Lembang" class="bg-black border border-zinc-800 rounded-xl p-3 text-sm">
<input id="f_motto" placeholder="Motto: Perjalanan nyaman adalah prioritas" class="bg-black border border-zinc-800 rounded-xl p-3 text-sm md:col-span-2">
<div class="md:col-span-2">
<label class="text-xs text-zinc-500">Foto Driver</label>
<input id="f_photo" type="file" accept="image/*" class="mt-1 w-full bg-black border border-zinc-800 rounded-xl p-3 text-sm">
<img id="preview" class="w-24 h-24 rounded-full mt-3 hidden object-cover"/>
</div>
</div>
<div class="flex gap-3 mt-5">
<button id="btnSave" class="bg-[#D4AF37] text-black font-bold px-6 py-2 rounded-full text-sm">Simpan ke Supabase</button>
<button id="btnCancel" class="bg-zinc-800 text-white px-6 py-2 rounded-full text-sm">Batal</button>
</div>
<p id="status" class="text-xs text-zinc-500 mt-3"></p>
</div>

<!-- LIST -->
<div class="bg-zinc-900 border border-zinc-800 rounded-[20px] overflow-hidden">
<div class="p-4 border-b border-zinc-800 flex justify-between text-[11px] tracking-widest text-zinc-500">
<span>DRIVER</span><span>SLUG / LINK</span>
</div>
<div id="list" class="divide-y divide-zinc-800"></div>
</div>
</div>

<script>
// GANTI INI DENGAN PUNYA KAMU
const SUPA_URL = "https://wjmotidelqgcyyujacudsupabase.co"; // ambil dari supabase dashboard project TEMPERA
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqbW90aWRlbHFnY3l5dWphY3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMzE2ODIsImV4cCI6MjEwNDkwNzY4Mn0.kZVRZhw0ryUcT-Pb7akpaO6vR4gOGwCkpD1kvk_uRac"; // anon public key

const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

const $ = id => document.getElementById(id);
let editingId = null;

$('btnAdd').onclick = () => {
  editingId = null;
  $('formBox').classList.remove('hidden');
  $('f_name').value=''; $('f_slug').value=''; $('f_base').value=''; $('f_motto').value=''; $('f_photo').value=''; $('preview').classList.add('hidden');
  $('status').textContent='';
}
$('btnCancel').onclick = () => $('formBox').classList.add('hidden');

$('f_name').addEventListener('input', e=>{
  const slug = e.target.value.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if(!editingId) $('f_slug').value = slug;
});
$('f_photo').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(file){ $('preview').src = URL.createObjectURL(file); $('preview').classList.remove('hidden'); }
});

async function loadDrivers(){
  const { data, error } = await supa.from('drivers').select('*').order('created_at', {ascending:false});
  if(error){ $('list').innerHTML = `<p class="p-4 text-red-400 text-sm">${error.message}<br>Pastikan RLS policy SELECT allow public</p>`; return; }
  $('count').textContent = data.length;
  $('list').innerHTML = data.map(d=>`
    <div class="p-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-zinc-800 flex items-center justify-center overflow-hidden">
          ${d.photo_url ? `<img src="${d.photo_url}" class="w-full h-full object-cover"/>` : `<span class="text-xs font-bold">${(d.name||d.base||'?').substring(0,2).toUpperCase()}</span>`}
        </div>
        <div>
          <p class="text-sm font-bold">${d.name||d.base||'-'}</p>
          <p class="text-[11px] text-zinc-500 italic">"${d.motto||''}"</p>
          <p class="text-[10px] text-zinc-600">${d.base||''} • ⭐ ${d.rating||'4.9'} • ${d.trips||0} trips</p>
        </div>
      </div>
      <div class="text-right">
        <p class="text-xs text-[#D4AF37]">${d.slug||'-'}</p>
        <a href="/TEMPERA.ID/r/${d.slug}" target="_blank" class="text-[11px] text-zinc-500">tempera.id/r/${d.slug}</a><br>
        <button onclick="editDriver('${d.id}')" class="text-[10px] text-zinc-400 underline mt-1">Edit</button>
      </div>
    </div>
  `).join('');
}

window.editDriver = async (id) => {
  const { data } = await supa.from('drivers').select('*').eq('id', id).single();
  if(!data) return;
  editingId = id;
  $('formBox').classList.remove('hidden');
  $('f_name').value = data.name||'';
  $('f_slug').value = data.slug||'';
  $('f_base').value = data.base||'';
  $('f_motto').value = data.motto||'';
  if(data.photo_url){ $('preview').src = data.photo_url; $('preview').classList.remove('hidden'); }
  window.scrollTo({top:0, behavior:'smooth'});
}

$('btnSave').onclick = async () => {
  const name = $('f_name').value.trim();
  const slug = $('f_slug').value.trim().toLowerCase();
  const base = $('f_base').value.trim();
  const motto = $('f_motto').value.trim();
  const file = $('f_photo').files[0];

  if(!name || !slug){ alert('Nama dan slug wajib'); return; }
  $('status').textContent = 'Uploading...';
  
  let photo_url = null;
  // kalau edit, ambil photo_url lama dulu
  if(editingId){
    const { data: old } = await supa.from('drivers').select('photo_url').eq('id', editingId).single();
    photo_url = old?.photo_url || null;
  }

  if(file){
    $('status').textContent = 'Upload foto ke Supabase Storage...';
    const fileName = `${slug}-${Date.now()}.${file.name.split('.').pop()}`;
    // bucket harus bernama 'drivers' dan public
    const { data: upData, error: upErr } = await supa.storage.from('drivers').upload(fileName, file, { upsert: true });
    if(upErr){ $('status').textContent = 'Gagal upload: '+upErr.message + ' - buat bucket drivers public dulu di Storage'; return; }
    const { data: pub } = supa.storage.from('drivers').getPublicUrl(fileName);
    photo_url = pub.publicUrl;
  }

  $('status').textContent = 'Menyimpan ke tabel drivers...';
  const payload = { name, slug, base, motto, photo_url, rating: 4.9, trips: 0 };

  let error;
  if(editingId){
    const res = await supa.from('drivers').update(payload).eq('id', editingId);
    error = res.error;
  } else {
    const res = await supa.from('drivers').insert(payload);
    error = res.error;
  }

  if(error){ $('status').textContent = 'Gagal simpan: '+error.message; }
  else { $('status').textContent = 'Berhasil! Foto sudah konek, cek di /driver/'+slug; $('formBox').classList.add('hidden'); loadDrivers(); }
}

loadDrivers();
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
