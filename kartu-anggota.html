        .field input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;transition:.15s;outline:none;background:#fff}
        .field input[type=text]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(8,145,178,.15)}
        .field input[readonly]{background:#f1f5f9;color:#475569}
        .photorow{display:flex;align-items:center;gap:12px}
        .photorow .prev{width:48px;height:48px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none;font-size:16px;box-shadow:0 2px 8px rgba(8,145,178,.25);border:2px solid #fff}
        .photorow .prev img{width:100%;height:100%;object-fit:cover;display:block}
        .photorow .filewrap{flex:1}
        .photorow input[type=file]{width:100%;font-size:12.5px;color:#475569}
        .photorow input[type=file]::file-selector-button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;margin-right:10px}
        .actions{display:flex;gap:10px;justify-content:center;margin-bottom:26px}
        .btn{border:0;border-radius:999px;padding:10px 22px;font-weight:800;font-size:13px;cursor:pointer;letter-spacing:.01em;transition:.15s;display:inline-flex;align-items:center;gap:8px}
        .btn:disabled{opacity:.6;cursor:not-allowed}
        .btn-primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(8,145,178,.25)}
        .btn-primary:hover{background:var(--accent-dk)}
        .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 1px 2px rgba(15,23,42,.05)}
        .btn-ghost:hover{background:#f8fafc}
        .sheet{display:flex;flex-wrap:wrap;gap:28px;justify-content:center;align-items:flex-start}
        .piece{text-align:center}
        .piece .lbl{font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
        .card{width:var(--card-w);height:var(--card-h);border-radius:3mm;position:relative;overflow:hidden;background:#fff;box-shadow:0 10px 28px rgba(15,23,42,.14),0 1px 3px rgba(15,23,42,.08);text-align:left}

        .wave{position:relative;height:24mm;overflow:hidden}
        .wave svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
        .wave .hdr{position:relative;z-index:1;padding:4mm 4mm 0;color:#fff;text-align:left;display:flex;align-items:center;gap:2.2mm}
        .wave .hlogo{width:6.6mm;height:6.6mm;flex:none;object-fit:contain;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15))}
        .wave .hlogo-fallback{width:6.6mm;height:6.6mm;background:#fff;color:var(--accent-dk);border-radius:1.2mm;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:3.6mm;flex:none}
        .wave .hname{font-weight:900;font-size:3.1mm;letter-spacing:.03em;line-height:1}
        .wave .htag{font-size:1.75mm;opacity:.92;margin-top:.6mm;letter-spacing:.04em}
        .front .fbody{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 4mm 4mm;margin-top:-9.5mm}
        .photo{width:23mm;height:23mm;border-radius:50%;flex:none;overflow:hidden;border:.7mm solid #fff;box-shadow:0 0 0 .3mm var(--line),0 2mm 5mm rgba(15,23,42,.22);background:linear-gradient(135deg,var(--accent-dk),var(--accent-lt));display:flex;align-items:center;justify-content:center;position:relative}
        .photo img{width:100%;height:100%;object-fit:cover;display:block}
        .photo .init{color:#fff;font-size:7.8mm;font-weight:900;letter-spacing:-.02em}
        .mname{font-weight:900;font-size:4.4mm;line-height:1.2;margin-top:3.6mm;color:var(--ink);max-width:100%;word-break:break-word}
        .role{margin-top:2.2mm;background:var(--accent);color:#fff;font-size:1.85mm;font-weight:900;letter-spacing:.09em;padding:1.1mm 3.6mm;border-radius:99mm;box-shadow:0 1px 4px rgba(8,145,178,.25)}
        .fields{margin-top:4.8mm;width:100%;text-align:left;border-top:.25mm solid var(--line);padding-top:3.8mm}
        .frow{display:grid;grid-template-columns:15mm 1fr;gap:1.2mm;font-size:2.35mm;padding:1.1mm 0;align-items:start}
        .frow .k{color:var(--muted);font-weight:800;letter-spacing:.05em}
        .frow .v{color:var(--ink);font-weight:800;word-break:break-word;line-height:1.25}
        .motto{margin-top:auto;padding-top:3.2mm;color:var(--muted);font-size:1.85mm;font-style:italic;letter-spacing:.01em}
        .back .bbody{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;padding:0 4mm 4mm;gap:1.6mm;margin-top:-9.5mm;height:calc(100% - 24mm + 9.5mm)}
        .perf{position:relative;width:100%;border-top:.3mm dashed var(--line);margin:2.2mm 0 1.2mm}
        .perf span{position:absolute;top:-2.1mm;left:50%;transform:translateX(-50%);background:#fff;padding:0 1.8mm;font-size:1.7mm;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;white-space:nowrap;font-weight:800}
        .qrbox{width:22mm;height:22mm;border:.3mm solid var(--line);border-radius:1.8mm;padding:1.1mm;background:#fff;margin-top:2.2mm;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(15,23,42,.06)}

        .backcode{color:var(--accent-dk);font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:2.55mm;letter-spacing:.05em;margin-top:1.2mm}
        .terms{color:var(--muted);font-size:1.78mm;line-height:1.55;text-align:center;margin-top:1.2mm;max-width:45mm}
        .backfoot{margin-top:auto;text-align:center;padding-top:1.8mm;border-top:.25mm solid var(--line);width:100%}
        .backfoot .co{font-weight:900;font-size:2.55mm;letter-spacing:.07em;color:var(--ink)}
        .backfoot .contact{color:var(--muted);font-size:1.8mm;margin-top:.6mm}

        }
